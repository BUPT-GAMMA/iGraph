name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: '运行完整后端回归（含算法逐项校验、大图集成、故障注入、隔离计算、重启恢复及 20 次取消验证）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  config:
    name: Configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Disposable test credential; non-CI environments supply their own random secret.
      IGRAPH_CONTROL_SERVICE_KEY: ci-service-configuration-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: |
          # --env-file supplies interpolation; services also require env_file: .env.
          # Validate in a temporary directory so an existing local .env is untouched.
          compose_dir=$(mktemp -d)
          trap 'rm -rf "$compose_dir"' EXIT
          cp compose.yaml "$compose_dir/compose.yaml"
          cp .env.example "$compose_dir/.env"
          docker compose --project-directory "$compose_dir" --env-file "$compose_dir/.env" -f "$compose_dir/compose.yaml" config -q

      - name: Check service Dockerfiles without building images
        run: |
          for dockerfile in frontend/Dockerfile deploy/docker/backend.Dockerfile \
            deploy/docker/agent-runtime.Dockerfile deploy/docker/graph-data.Dockerfile \
            deploy/docker/mcp.Dockerfile; do
            docker buildx build --check --platform linux/amd64 --file "$dockerfile" .
          done

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full == true && 45 || 20 }}
    services:
      control-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cancellation-ci-only
          POSTGRES_DB: cancellation_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cancellation_tests"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      # Disposable test credential; non-CI environments supply their own random secret.
      IGRAPH_CONTROL_SERVICE_KEY: ci-service-configuration-only
      IGRAPH_CONTROL_TEST_DATABASE_URL: postgresql+psycopg://postgres:cancellation-ci-only@127.0.0.1:5432/cancellation_tests
      IGRAPH_CANCEL_TEST_REPETITIONS: ${{ inputs.full == true && '20' || '1' }}
      FULL_REGRESSION: ${{ inputs.full == true && 'true' || 'false' }}
      AGNO_TELEMETRY: "false"
      GRAPH_COMPUTE_CONCURRENCY: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt
            deploy/requirements/*.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run Python regressions
        env:
          GRAPH_DATA_UPLOAD_DIR: ${{ runner.temp }}/igraph-uploads/graph-data
          IGRAPH_DATA_ROOT: ${{ runner.temp }}/igraph-data
        run: |
          pytest_args=()
          if [[ "$FULL_REGRESSION" != true ]]; then
            # Core checks only. Per-algorithm result verification, large-graph
            # integration, fault injection and restart recovery run via
            # workflow_dispatch with full=true. The deselected test is
            # timing-sensitive on shared runners.
            pytest_args+=(
              --ignore=tests/servers/test_graph_data_app.py
              --ignore=tests/servers/test_large_graph_all_algorithms.py
              --ignore=tests/test_large_graph_execution_integration.py
              --ignore=tests/test_isolated_compute.py
              --ignore=tests/test_cancellation_failures.py
              --ignore=tests/test_execution_restart.py
              --deselect=tests/test_workspace_tools.py::test_workspace_bash_timeout_is_structured
            )
          fi
          python -m pytest -q --durations=10 "${pytest_args[@]}"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

  gate:
    name: Required checks
    if: ${{ always() }}
    needs:
      - config
      - python
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          CONFIG_RESULT: ${{ needs.config.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [[ "$CONFIG_RESULT" != "success" || "$PYTHON_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            echo "Required jobs did not all succeed: config=$CONFIG_RESULT python=$PYTHON_RESULT frontend=$FRONTEND_RESULT"
            exit 1
          fi
          echo "All required CI jobs succeeded."
