name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AGNO_TELEMETRY: "false"
      GRAPH_COMPUTE_CONCURRENCY: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt
            deploy/requirements/*.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run Python core tests
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          GRAPH_DATA_UPLOAD_DIR: ${{ runner.temp }}/igraph-uploads/graph-data
          IGRAPH_DATA_ROOT: ${{ runner.temp }}/igraph-data
        run: |
          python -m pytest -q \
            --cov \
            --cov-report= \
            --cov-fail-under=0 \
            --ignore-glob='tests/servers/test_graph_classification*.py' \
            --ignore=tests/servers/test_graph_classifier.py \
            --ignore-glob='tests/servers/test_graph_ml*.py'

      - name: Run Python graph ML tests and finalize coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          GRAPH_DATA_UPLOAD_DIR: ${{ runner.temp }}/igraph-uploads/graph-data
          IGRAPH_DATA_ROOT: ${{ runner.temp }}/igraph-data
        run: |
          python -m pytest -q \
            --cov \
            --cov-append \
            --cov-report=xml:coverage.xml \
            tests/servers/test_graph_classification*.py \
            tests/servers/test_graph_classifier.py \
            tests/servers/test_graph_ml*.py

      - name: Validate Compose configuration
        if: ${{ !cancelled() }}
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Install Playwright Chrome
        run: pnpm exec playwright install --with-deps chrome

      - name: Run frontend end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright/test-results
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: Required checks
    if: ${{ always() }}
    needs:
      - python
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: |
          if [[ "$PYTHON_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            echo "Required jobs did not all succeed: python=$PYTHON_RESULT frontend=$FRONTEND_RESULT"
            exit 1
          fi
          echo "All required CI jobs succeeded."
