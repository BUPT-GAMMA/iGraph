name: Benchmark CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: Benchmark tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GRAPH_COMPUTE_CONCURRENCY: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check benchmark launcher syntax
        run: bash -n run_benchmark.sh scripts/run_zhizengzeng_benchmark.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install CPU benchmark dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.1+cpu
          python -m pip install -r requirements-ci.txt

      - name: Verify launcher wiring
        run: PYTHON_BIN="$(command -v python)" bash run_benchmark.sh --help >/dev/null

      - name: Run synthetic benchmark tests
        env:
          GRAPH_DATA_UPLOAD_DIR: ${{ runner.temp }}/igraph-benchmark/uploads
          GRAPH_ML_ARTIFACT_ROOT: ${{ runner.temp }}/igraph-benchmark/artifacts
          IGRAPH_DATA_ROOT: ${{ runner.temp }}/igraph-benchmark/data
        run: |
          python -m pytest -q \
            tests/test_agent_protocol.py \
            tests/test_benchmark_bundle.py \
            tests/test_benchmark_runner.py \
            tests/test_codex_harness_adapter.py \
            tests/test_dataset_routing.py \
            tests/test_evaluation_modes.py \
            tests/test_judge_and_masked_dataset.py \
            tests/test_parallel_runner.py \
            tests/test_question_cli.py \
            tests/test_question_scoring.py \
            tests/test_questions.py \
            tests/test_server_rootless_cleanup.py \
            tests/test_tool_names.py \
            tests/test_virtual_graph_ml.py \
            tests/test_virtual_ml_broker.py \
            tests/test_zhizengzeng_adapters.py \
            tests/test_zhizengzeng_launcher.py \
            tests/servers/test_graph_classification_batching.py \
            tests/servers/test_graph_classification_dataset_loader.py \
            tests/servers/test_graph_classification_metrics.py \
            tests/servers/test_graph_classification_train_infer.py \
            tests/servers/test_graph_classifier.py \
            tests/servers/test_graph_ml_dataset_store.py
