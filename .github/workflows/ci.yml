name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      full:
        description: '运行完整回归（故障注入、20 次取消验证及浏览器 E2E）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Feature-branch runs may be superseded. A production deployment must finish
  # before a newer main run starts, otherwise an interrupted SSH session could
  # leave the host between releases.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      control-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cancellation-ci-only
          POSTGRES_DB: cancellation_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cancellation_tests"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      # Disposable test credential; production supplies its own random secret.
      IGRAPH_CONTROL_SERVICE_KEY: ci-service-configuration-only
      IGRAPH_CONTROL_TEST_DATABASE_URL: postgresql+psycopg://postgres:cancellation-ci-only@127.0.0.1:5432/cancellation_tests
      IGRAPH_CANCEL_TEST_REPETITIONS: ${{ inputs.full == true && '20' || '1' }}
      FULL_REGRESSION: ${{ inputs.full == true && 'true' || 'false' }}
      AGNO_TELEMETRY: "false"
      GRAPH_COMPUTE_CONCURRENCY: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: |
          # --env-file supplies interpolation; services also require env_file: .env.
          # Validate in a temporary directory so an existing local .env is untouched.
          compose_dir=$(mktemp -d)
          trap 'rm -rf "$compose_dir"' EXIT
          cp compose.yaml "$compose_dir/compose.yaml"
          cp .env.example "$compose_dir/.env"
          docker compose --project-directory "$compose_dir" --env-file "$compose_dir/.env" -f "$compose_dir/compose.yaml" config -q

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt
            deploy/requirements/*.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run Python regressions
        env:
          GRAPH_DATA_UPLOAD_DIR: ${{ runner.temp }}/igraph-uploads/graph-data
          IGRAPH_DATA_ROOT: ${{ runner.temp }}/igraph-data
        run: |
          pytest_args=()
          if [[ "$FULL_REGRESSION" != true ]]; then
            pytest_args+=(
              --ignore=tests/test_isolated_compute.py
              --ignore=tests/test_cancellation_failures.py
              --ignore=tests/test_execution_restart.py
            )
          fi
          python -m pytest -q --durations=10 "${pytest_args[@]}"

      - name: Set up pnpm for real browser integration
        if: ${{ inputs.full == true }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js for real browser integration
        if: ${{ inputs.full == true }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend and browser dependencies
        if: ${{ inputs.full == true }}
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chrome

      - name: Run Factory browser regressions
        if: ${{ inputs.full == true }}
        working-directory: frontend
        env:
          IGRAPH_TEST_PYTHON: python
        run: pnpm test:e2e:native

      - name: Run cancellation browser regressions
        if: ${{ inputs.full == true }}
        working-directory: frontend
        env:
          IGRAPH_TEST_PYTHON: python
        run: pnpm test:e2e:cancel

      - name: Upload full-stack browser diagnostics
        if: ${{ failure() && inputs.full == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-stack-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/native-results
            output/playwright/cancellation-results
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Install Playwright Chrome
        if: ${{ inputs.full == true }}
        run: pnpm exec playwright install --with-deps chrome

      - name: Run frontend end-to-end tests
        if: ${{ inputs.full == true }}
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ failure() && inputs.full == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright/test-results
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: Required checks
    if: ${{ always() }}
    needs:
      - python
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: |
          if [[ "$PYTHON_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            echo "Required jobs did not all succeed: python=$PYTHON_RESULT frontend=$FRONTEND_RESULT"
            exit 1
          fi
          echo "All required CI jobs succeeded."

  publish-images:
    name: Publish ${{ matrix.name }} image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: frontend
            dockerfile: frontend/Dockerfile
            image: ghcr.io/bupt-gamma/igraph-frontend
          - name: backend
            dockerfile: deploy/docker/backend.Dockerfile
            image: ghcr.io/bupt-gamma/igraph-backend
          - name: agent-runtime
            dockerfile: deploy/docker/agent-runtime.Dockerfile
            image: ghcr.io/bupt-gamma/igraph-agent-runtime
          - name: graph-engine-api
            dockerfile: deploy/docker/graph-data.Dockerfile
            image: ghcr.io/bupt-gamma/igraph-graph-engine-api
          - name: graph-engine-mcp
            dockerfile: deploy/docker/mcp.Dockerfile
            image: ghcr.io/bupt-gamma/igraph-graph-engine-mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-production:
    name: Deploy production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - gate
      - publish-images
    runs-on: ubuntu-24.04
    # The first pull includes large ML layers and the server's GHCR route is slow.
    # The deployment script retries transient resets, so leave enough time for it.
    timeout-minutes: 60
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: hdssh01.casdao.com
      DEPLOY_PORT: "63125"
      DEPLOY_USER: keyuyang
      DEPLOY_ROOT: /home/keyuyang/apps/igraph
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure pinned SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [[ -z "$DEPLOY_SSH_KEY" ]]; then
            echo "Repository secret DEPLOY_SSH_KEY is required." >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/igraph_cd"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/igraph_cd"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/igraph_cd" >/dev/null
          install -m 600 deploy/production/known_hosts "$RUNNER_TEMP/known_hosts"

      - name: Upload release and deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          release_dir="${DEPLOY_ROOT}/releases/${GITHUB_SHA}"
          ssh_options=(
            -p "$DEPLOY_PORT"
            -i "$RUNNER_TEMP/igraph_cd"
            -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )
          scp_options=(
            -P "$DEPLOY_PORT"
            -i "$RUNNER_TEMP/igraph_cd"
            -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )

          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$remote" "install -d -m 700 '$release_dir'"
          scp "${scp_options[@]}" \
            compose.yaml \
            deploy/production/compose.production.yaml \
            deploy/production/deploy.sh \
            "${remote}:${release_dir}/"

          logout_registry() {
            ssh "${ssh_options[@]}" "$remote" \
              "export DOCKER_HOST=unix:///run/user/\$(id -u)/docker.sock; docker logout ghcr.io >/dev/null 2>&1 || true" \
              || true
          }
          trap logout_registry EXIT

          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$remote" \
            "export DOCKER_HOST=unix:///run/user/\$(id -u)/docker.sock; docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

          deploy_succeeded=false
          for attempt in 1 2 3; do
            echo "Starting remote deployment (SSH attempt ${attempt}/3)."
            # shellcheck disable=SC2029
            if ssh "${ssh_options[@]}" "$remote" \
              "chmod 700 '$release_dir/deploy.sh' && DEPLOY_ROOT='$DEPLOY_ROOT' '$release_dir/deploy.sh' '$GITHUB_SHA'"; then
              deploy_succeeded=true
              break
            fi

            if ((attempt < 3)); then
              delay=$((attempt * 15))
              echo "SSH deployment command was interrupted; retrying in ${delay}s." >&2
              sleep "$delay"
            fi
          done

          if [[ "$deploy_succeeded" != true ]]; then
            echo "Remote deployment failed after 3 SSH attempts." >&2
            exit 1
          fi
