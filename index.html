// ── Message row templates ──────────────────────────────────────────
function msgRowHtml(m, index, isLast = false) {
  if (m.streaming) return streamingRowHtml();
  if (m.role === 'user') return userRowHtml(m.content);
  return agentRowHtml(m.content, m.tools || [], m.progressItems || [], m.thinking || [], m.plan || null, m.solverSteps || [], m.feedbackRequests || m.feedbackRequest || null, m.graphs || [], index, isLast);
}

function userRowHtml(content) {
  return `<div class="msg-row user fade-in">
    <div class="bubble bubble-user">${esc(content).replace(/\n/g,'<br>')}</div>
  </div>`;
}

function agentRowHtml(content, tools, progressItems, thinking, plan, solverSteps, feedbackRequest, graphs, messageIndex, isLast = false) {
  const feedbackList = normalizeFeedbackRequests(feedbackRequest);
  const activeFeedback = state.pendingFeedback && feedbackList.some(req => state.pendingFeedback.request_id === req.request_id);
  const isPendingFeedbackCard = feedbackList.some(req => String(req.status || 'pending') === 'pending');
  const canCopy = String(content || '').trim().length > 0;
  const canRegenerate = isLast && !state.loading && !state.pendingFeedback && !isPendingFeedbackCard;
  const copyBtn = canCopy
    ? `<button class="message-action-btn" onclick="copyAssistantMessage(${Number(messageIndex)}, this)" title="复制原始 Markdown" aria-label="复制该回复的原始 Markdown">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>复制</span>
      </button>`
    : '';
  const regenerateBtn = canRegenerate
    ? `<button class="message-action-btn" onclick="regenerateLastMessage()" title="重新生成此回复" aria-label="重新生成此回复">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.35"/></svg>
        <span>重新生成</span>
      </button>`
    : '';
  const actionBtns = (copyBtn || regenerateBtn) ? `<div class="message-actions">${copyBtn}${regenerateBtn}</div>` : '';
  return `<div class="msg-row agent fade-in">
    <div class="bubble bubble-agent">
      ${planPanelHtml(plan || null, { analyzing: false })}
      ${solverPanelHtml(solverSteps || [])}
      ${feedbackCardsHtml(feedbackList)}
      ${thinkingSectionHtml(thinking || [])}
      ${toolsHtml(tools || [])}
      ${progressItemsHtml(progressItems || [])}
      ${(graphs && graphs.length) ? graphs.map(g => buildInlineGraphCardHtml(g)).join('') : ''}
      ${content ? `<div class="md">${md(content)}</div>` : ''}
      ${actionBtns}
    </div>
  </div>`;
}

function streamingRowHtml() {
  const streamingFeedback = pendingFeedbackRequests(state.streamFeedbackRequests, state.streamFeedbackRequest, state.pendingFeedback)
    .filter(req => feedbackStepId(req) === null);
  return `<div id="streaming-row" class="msg-row agent fade-in">
    <div id="streaming-bubble" class="bubble bubble-agent">
      <div id="streaming-plan">${planPanelHtml(state.currentPlan, { analyzing: state.planAnalyzing })}</div>
      <div id="streaming-solver">${solverPanelHtml(state.solverSteps)}</div>
      <div id="streaming-feedback">${feedbackCardsHtml(streamingFeedback)}</div>
      <div id="streaming-thinking"></div>
      <div id="streaming-tools"></div>
      <div id="streaming-progress"></div>
      <div id="streaming-graphs"></div>
      <div id="streaming-content" class="md"></div>
    </div>
  </div>`;
}

function emptyHtml() {
  return `<div class="empty-state fade-in">
    <div class="empty-icon">
      <div style="width:24px;height:24px;color:var(--accent)">${ICO_GRAPH}</div>
    </div>
    <p class="empty-title">开始图分析</p>
    <p class="empty-sub">粘贴图的边数据、上传文件，或直接用自然语言提问</p>
    <div style="display:grid;gap:8px;max-width:340px;width:100%" id="examples-grid"></div>
  </div>`;
}

function attachExamples(grid) {
  [
    "请加载以下图:\nA B 4\nA C 2\nB C 1\nB D 5\nC D 8\nD E 2\nE F 3",
    "A 到 F 的最短路径是什么？",
    "帮我做社区检测",
  ].forEach(ex => {
    const btn = document.createElement('button');
    btn.className = 'example-btn';
    btn.textContent = ex;
    btn.addEventListener('click', () => {
      const ta = $('#inp-chat');
      if (!ta) return;
      ta.value = ex; ta.focus();
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 150) + 'px';
    });
    grid.appendChild(btn);
  });
}

function patchReasoningButton() {
  const btn = document.getElementById('btn-reasoning');
  if (!btn) return;
  const dis = !state.sessionId || state.loading || state.creating || state.switchingReasoning || state.switchingSession;
  btn.disabled = dis;
  btn.className = state.reasoningMode === 'staged' ? 'chip active-violet' : 'chip';
  btn.textContent = state.switchingReasoning ? '切换中…' : (state.reasoningMode === 'staged' ? '推理: 开' : '推理: 关');
}

function patchPlanningButton() {
  const btn = document.getElementById('btn-planning');
  if (!btn) return;
  const dis = !state.sessionId || state.loading || state.creating || state.switchingPlanning || state.switchingSession;
  btn.disabled = dis;
  btn.className = state.planningMode === 'always' ? 'chip active-blue' : state.planningMode === 'never' ? 'chip muted' : 'chip active-cyan';
  btn.textContent = state.switchingPlanning ? '切换中…' : state.planningMode === 'always' ? '规划: 强制' : state.planningMode === 'never' ? '规划: 关闭' : '规划: 自动';
}

function patchErrorBanner() {
  const wrap = document.getElementById('error-banner');
  const text = document.getElementById('error-banner-text');
  if (!wrap || !text) return;
  if (state.error) { text.textContent = state.error; wrap.style.display = 'flex'; }
  else { text.textContent = ''; wrap.style.display = 'none'; }
}

function patchInputState() {
  const dis = state.loading || state.creating || state.switchingSession || !state.sessionId || !!state.pendingFeedback;
  // Stop button (shown during loading) is always clickable; send button uses dis
  const stopOrSend = state.loading ? 'btn-stop' : 'btn-send';
  const stopOrSendDis = state.loading ? false : (state.creating || state.switchingSession || !state.sessionId || !!state.pendingFeedback);
  const ids = [[stopOrSend, stopOrSendDis], ['btn-upload', dis || state.uploading], ['btn-reasoning', dis || state.switchingReasoning], ['btn-planning', dis || state.switchingPlanning], ['inp-chat', dis], ['sel-model', dis || state.switchingModel]];
  ids.forEach(([id, d]) => { const el = document.getElementById(id); if (el) el.disabled = d; });
}

function patchGraphBadge() {
  const el = document.getElementById('graph-badge');
  if (el) el.innerHTML = graphBadgeHtml();
}

function patchStreamingTools() {
  const el = document.getElementById('streaming-tools');
  if (!el) return;
  el.innerHTML = toolsHtml(state.streamTools);
}

function patchStreamingProgress() {
  const el = document.getElementById('streaming-progress');
  if (!el) return;
  el.innerHTML = progressItemsHtml(state.streamProgressItems);
}

function patchStreamingThinking() {
  const el = document.getElementById('streaming-thinking');
  if (!el) return;
  el.innerHTML = thinkingSectionHtml(state.streamThinking);
}

function ensureThinkingBlockForPhase(phase) {
  const ctx = _streamCtx || state;
  const normalizedPhase = String(phase || 'thinking');
  const last = ctx.streamThinking[ctx.streamThinking.length - 1];
  if (!last || !last.streaming || String(last.phase) !== normalizedPhase) {
    const block = { phase: normalizedPhase, text: '', streaming: true };
    ctx.streamThinking.push(block);
    return block;
  }
  return last;
}

function snapshotModelTurn() {
  const ctx = _streamCtx || state;
  return {
    streamBuf: ctx.streamBuf,
    streamTools: ctx.streamTools.map(t => ({ ...t })),
    streamThinking: ctx.streamThinking.map(t => ({ ...t })),
    streamThinkingPhase: ctx.streamThinkingPhase,
  };
}

function restoreModelTurn(snapshot) {
  const ctx = _streamCtx || state;
  if (!snapshot) return;
  ctx.streamBuf = snapshot.streamBuf || '';
  ctx.streamTools = Array.isArray(snapshot.streamTools) ? snapshot.streamTools.map(t => ({ ...t })) : [];
  ctx.streamThinking = Array.isArray(snapshot.streamThinking) ? snapshot.streamThinking.map(t => ({ ...t })) : [];
  ctx.streamThinkingPhase = snapshot.streamThinkingPhase || null;
  if (ctx === state) {
    patchStreamingThinking();
    patchStreamingTools();
    const contentEl = document.getElementById('streaming-content');
    if (contentEl) {
      contentEl.innerHTML = ctx.streamBuf ? md(ctx.streamBuf) + '<span class="cursor"></span>' : '';
      renderMathIn(contentEl);
    }
    scrollToBottom(false, false);
  }
}

function finalizeStreamingBubble() {
  const ctx = _streamCtx || state;
  const isActive = ctx === state;
  if (isActive) {
    const content = document.getElementById('streaming-content');
    if (content) { content.innerHTML = ctx.streamBuf ? md(ctx.streamBuf) : ''; enhanceRichContent(content); }
  }
  ctx.streamThinking.forEach(t => { t.streaming = false; });
  if (isActive) {
    const thEl = document.getElementById('streaming-thinking');
    if (thEl) thEl.innerHTML = thinkingSectionHtml(ctx.streamThinking);
  }
  ctx.streamTools.forEach(t => { t.done = true; });
  if (isActive) {
    patchStreamingTools();
    patchStreamingProgress();
    patchStreamingFeedback();
    clearScheduledSolverPatch();
    patchSolverPanel();
  }
  const last = ctx.messages[ctx.messages.length - 1];
  if (last && last.streaming) {
    const requests = mergeFeedbackRequests(ctx.streamFeedbackRequests, ctx.streamFeedbackRequest, ctx.pendingFeedback);
    const topLevel = [];
    for (const req of requests) {
      if (feedbackStepId(req) !== null && assignFeedbackToSolverStep(req)) continue;
      topLevel.push({ ...req });
    }
    last.feedbackRequests = topLevel;
    last.feedbackRequest = null;
  }
  if (isActive) {
    for (const id of ['streaming-row','streaming-bubble','streaming-thinking','streaming-plan','streaming-solver','streaming-feedback','streaming-tools','streaming-progress','streaming-content']) {
      const el = document.getElementById(id);
      if (el) el.removeAttribute('id');
    }
  }
}

function patchPlanPanel() {
  const el = document.getElementById('streaming-plan');
  if (el) el.innerHTML = planPanelHtml(state.currentPlan, { analyzing: state.planAnalyzing });
}

function patchStreamingFeedback() {
  const el = document.getElementById('streaming-feedback');
  const requests = pendingFeedbackRequests(state.streamFeedbackRequests, state.streamFeedbackRequest, state.pendingFeedback);
  const topLevel = [];
  for (const req of requests) {
    const stepId = feedbackStepId(req);
    if (stepId !== null && assignFeedbackToSolverStep(req)) {
      queueSolverStepPatch(stepId, { immediate: true });
    } else {
      topLevel.push(req);
    }
  }
  if (el) el.innerHTML = feedbackCardsHtml(topLevel);
}

function patchSolverPanel() {
  const el = document.getElementById('streaming-solver');
  if (el) el.innerHTML = solverPanelHtml(state.solverSteps);
  scrollToBottom(false, false);
}

function patchSolverPanelStatusOnly() {
  const root = document.getElementById('streaming-solver');
  if (!root) return;
  const statusEl = root.querySelector('[data-solver-panel-status="true"]');
  if (statusEl) statusEl.textContent = solverPanelStatusText(state.solverSteps);
}

function patchSolverStep(stepId) {
  const root = document.getElementById('streaming-solver');
  if (!root) return;
  const step = state.solverSteps.find(s => Number(s.step_id) === Number(stepId));
  if (!step) return;
  const card = root.querySelector(`[data-solver-step-id="${String(stepId)}"]`);
  if (!card) { patchSolverPanel(); return; }
  card.outerHTML = solverStepHtml(step);
  const newCard = root.querySelector(`[data-solver-step-id="${String(stepId)}"]`);
  enhanceRichContent(newCard);
  patchSolverPanelStatusOnly();
  scrollToBottom(false, false);
}

function clearScheduledSolverPatch() {
  if (solverPatchTimer) { clearTimeout(solverPatchTimer); solverPatchTimer = null; }
  if (solverPatchRaf) {
    if (typeof cancelAnimationFrame === 'function') cancelAnimationFrame(solverPatchRaf);
    else clearTimeout(solverPatchRaf);
    solverPatchRaf = null;
  }
  solverPatchQueued = false;
  pendingSolverStepIds.clear();
}

function queueSolverStepPatch(stepId, { immediate = false } = {}) {
  const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  if (stepId !== undefined && stepId !== null) pendingSolverStepIds.add(String(stepId));
  const runPatch = () => {
    solverPatchTimer = null; solverPatchRaf = null; solverPatchQueued = false;
    solverPatchLastAt = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    const targets = Array.from(pendingSolverStepIds); pendingSolverStepIds.clear();
    if (!targets.length) { patchSolverPanelStatusOnly(); return; }
    for (const targetId of targets) patchSolverStep(targetId);
  };
  const scheduleFrame = () => {
    if (typeof requestAnimationFrame === 'function') solverPatchRaf = requestAnimationFrame(runPatch);
    else solverPatchRaf = setTimeout(runPatch, 16);
  };
  if (immediate) { clearScheduledSolverPatch(); runPatch(); return; }
  if (solverPatchQueued) return;
  solverPatchQueued = true;
  const delay = Math.max(0, SOLVER_PATCH_INTERVAL_MS - (now - solverPatchLastAt));
  if (delay === 0) { scheduleFrame(); return; }
  solverPatchTimer = setTimeout(scheduleFrame, delay);
}

function scrollToBottom(force = false, smooth = false) {
  if (!force && !state.autoScroll) return;
  const area = document.getElementById('msg-area');
  if (!area) return;
  area.scrollTo({ top: area.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
}

// ── SSE event handler ──────────────────────────────────────────────
function handleSseEvent(evt) {
  const ctx = _streamCtx || state;
  const isActive = ctx === state;
  switch (evt.type) {
    case 'context_usage': {
      ctx.contextUsage = normalizeContextUsage(evt.usage);
      if (isActive) { state.contextUsage = ctx.contextUsage; patchContextMeter(); }
      break;
    }
    case 'context_compressing': {
      ctx.contextUsage = normalizeContextUsage(evt.usage);
      ctx.contextCompressing = true;
      if (isActive) {
        state.contextUsage = ctx.contextUsage;
        state.contextCompressing = true;
        patchContextMeter();
        patchSessionNotice();
      }
      break;
    }
    case 'context_compressed': {
      ctx.contextUsage = normalizeContextUsage(evt.after || evt.usage);
      ctx.contextCompressing = false;
      if (isActive) {
        state.contextUsage = ctx.contextUsage;
        state.contextCompressing = false;
        const n = Number(state.contextUsage.compression_count || 0);
        state.sessionNotice = `已自动压缩 ${n > 0 ? n + ' 次' : ''}较早会话上下文，完整聊天记录仍保留在界面中。`;
        patchContextMeter();
        patchSessionNotice();
      }
      break;
    }
    case 'model_turn_start':
      ctx.contextCompressing = false;
      if (isActive) { state.contextCompressing = false; patchContextMeter(); patchSessionNotice(); }
      ctx.modelTurnCheckpoint = snapshotModelTurn();
      break;
    case 'model_turn_retry':  restoreModelTurn(ctx.modelTurnCheckpoint); ctx.modelTurnCheckpoint = snapshotModelTurn(); break;

    case 'thinking_start': {
      if (!evt.phase || evt.phase === 'answer') break;
      ctx.streamThinkingPhase = String(evt.phase); break;
    }
    case 'thinking': {
      if (!evt.phase || evt.phase === 'answer') break;
      if (!String(evt.content || '').trim()) break;
      const block = ensureThinkingBlockForPhase(String(evt.phase));
      ctx.streamThinkingPhase = String(evt.phase);
      block.text += evt.content;
      if (isActive) { patchStreamingThinking(); scrollToBottom(false, false); }
      break;
    }
    case 'thinking_end': {
      if (!evt.phase || evt.phase === 'answer') break;
      let block = null;
      for (let i = ctx.streamThinking.length - 1; i >= 0; i--) {
        if (ctx.streamThinking[i]?.streaming) { block = ctx.streamThinking[i]; break; }
      }
      if (block) {
        if (!String(block.text || '').trim()) { const idx = ctx.streamThinking.indexOf(block); if (idx >= 0) ctx.streamThinking.splice(idx, 1); }
        else block.streaming = false;
      }
      ctx.streamThinkingPhase = null;
      if (isActive) patchStreamingThinking();
      break;
    }

    case 'token': {
      ctx.streamBuf += evt.content;
      if (isActive) {
        const contentEl = document.getElementById('streaming-content');
        if (contentEl) {
          contentEl.innerHTML = md(ctx.streamBuf) + '<span class="cursor"></span>';
          renderMathIn(contentEl);
        }
        scrollToBottom(false, false);
      }
      break;
    }
    case 'tool_call':
      ctx.streamTools.push({ tool: evt.tool, args: evt.args, call_id: evt.call_id || '', done: false });
      if (isActive) { patchStreamingTools(); scrollToBottom(false, false); }
      break;
    case 'tool_result':
      {
        const target = findToolEventTarget(ctx.streamTools, evt.tool, evt.call_id);
        if (target) {
          target.done = true;
        }
      }
      if (isActive) { patchStreamingTools(); }
      break;
    case 'tool_progress': {
      const progressTool = toolNameOf(evt.tool);
      if (!isProgressToolName(progressTool)) break;
      const stepId = eventStepId(evt);
      if (stepId !== null && assignProgressToSolverStep(evt)) {
        if (isActive) {
          queueSolverStepPatch(stepId);
          scrollToBottom(false, false);
        }
        break;
      }
      const items = Array.isArray(ctx.streamProgressItems) ? ctx.streamProgressItems : (ctx.streamProgressItems = []);
      upsertProgressItem(items, evt);
      if (isActive) { patchStreamingProgress(); scrollToBottom(false, false); }
      break;
    }
    case 'feedback_resolved': {
      const req = evt.request && typeof evt.request === 'object' ? evt.request : null;
      if (!req) break;
      const status = String(req.status || 'approve');
      ctx.pendingFeedback = null;
      ctx.streamFeedbackRequest = { ...req, status };
      ctx.streamFeedbackRequests = upsertFeedbackRequest(ctx.streamFeedbackRequests || [], ctx.streamFeedbackRequest);
      ctx.feedbackArgsText = '';
      ctx.feedbackComment = '';
      if (isActive) {
        markFeedbackRequestResolved(req.request_id, status, req.patched_args || null, req.comment || '');
        assignFeedbackToSolverStep(ctx.streamFeedbackRequest);
        patchStreamingFeedback();
        patchSolverPanel();
        patchInputState();
        scrollToBottom(false, false);
      } else {
        assignFeedbackToSolverStep(ctx.streamFeedbackRequest);
      }
      break;
    }

    case 'plan_analyzing': {
      ctx.planAnalyzing = true;
      ctx.currentPlan = { plan_id: '', completed: false, steps: [] };
      if (isActive) patchPlanPanel();
      break;
    }
    case 'plan_step': {
      const incomingStep = evt.step && typeof evt.step === 'object' ? evt.step : null;
      if (!incomingStep) break;
      if (!ctx.currentPlan) ctx.currentPlan = { plan_id: String(evt.plan_id || ''), completed: false, steps: [] };
      if (!ctx.currentPlan.plan_id && evt.plan_id) ctx.currentPlan.plan_id = String(evt.plan_id);
      const exists = ctx.currentPlan.steps.some(s => Number(s.step_id) === Number(incomingStep.step_id));
      if (!exists) {
        ctx.currentPlan.steps.push({ ...incomingStep, status: incomingStep.status || 'pending', result_summary: incomingStep.result_summary || '' });
        ctx.currentPlan.steps.sort((a, b) => Number(a.step_id) - Number(b.step_id));
      }
      if (isActive) { patchPlanPanel(); scrollToBottom(false, false); }
      break;
    }
    case 'plan_ready': {
      ctx.planAnalyzing = false;
      ctx.currentPlan = {
        plan_id: evt.plan_id, completed: false,
        steps: Array.isArray(evt.steps) ? evt.steps.map(s => ({ ...s, status: s.status || 'pending', result_summary: s.result_summary || '' })) : [],
      };
      if (isActive) { patchPlanPanel(); scrollToBottom(false, false); }
      break;
    }
    case 'solve_step_start': {
      ctx.solverActiveStep = evt.step_id;
      let solverStep = findSolverStep(evt.step_id);
      if (solverStep) {
        solverStep.goal = evt.goal || solverStep.goal || '';
        solverStep.status = 'running';
        if (!Array.isArray(solverStep.progressItems)) solverStep.progressItems = [];
      } else {
        solverStep = { step_id: evt.step_id, goal: evt.goal || '', status: 'running', tokens: '', tools: [], thinking: '', progressItems: [] };
        ctx.solverSteps.push(solverStep);
      }
      solverStep = dedupeSolverStep(evt.step_id) || solverStep;
      if (ctx.currentPlan?.steps) {
        const step = ctx.currentPlan.steps.find(x => Number(x.step_id) === Number(evt.step_id));
        if (step) step.status = 'running';
      }
      if (isActive) {
        if (findSolverStep(evt.step_id) === solverStep && ctx.solverSteps.filter(x => Number(x.step_id) === Number(evt.step_id)).length === 1) {
          const existingCard = document.getElementById('streaming-solver')?.querySelector(`[data-solver-step-id="${String(evt.step_id)}"]`);
          if (existingCard) queueSolverStepPatch(evt.step_id, { immediate: true });
          else patchSolverPanel();
        } else {
          patchSolverPanel();
        }
      }
      break;
    }
    case 'solve_token': {
      const s = ctx.solverSteps.find(x => Number(x.step_id) === Number(evt.step_id));
      if (s) s.tokens += (evt.content || '');
      if (isActive) queueSolverStepPatch(evt.step_id);
      break;
    }
    case 'solve_thinking': {
      const s = ctx.solverSteps.find(x => Number(x.step_id) === Number(evt.step_id));
      if (s && evt.phase === 'content') s.thinking += (evt.content || '');
      if (isActive) queueSolverStepPatch(evt.step_id);
      break;
    }
    case 'solve_tool_call': {
      const s = ctx.solverSteps.find(x => Number(x.step_id) === Number(evt.step_id));
      if (s) s.tools.push({ tool: evt.tool, args: evt.args, call_id: evt.call_id || '', done: false });
      if (isActive) queueSolverStepPatch(evt.step_id);
      break;
    }
    case 'solve_tool_result': {
      const s = ctx.solverSteps.find(x => Number(x.step_id) === Number(evt.step_id));
      if (s) {
        const target = findToolEventTarget(s.tools, evt.tool, evt.call_id);
        if (target) {
          target.done = true;
        }
      }
      if (isActive) { queueSolverStepPatch(evt.step_id); }
      break;
    }
    case 'solve_step_done': {
      const s = ctx.solverSteps.find(x => Number(x.step_id) === Number(evt.step_id));
      if (s) {
        s.status = evt.status || 'done';
        if (s.status !== 'waiting_user' && !s.tokens && evt.summary) s.tokens = evt.summary;
      }
      if (ctx.currentPlan?.steps) {
        const step = ctx.currentPlan.steps.find(x => Number(x.step_id) === Number(evt.step_id));
        if (step) { step.status = evt.status || 'done'; step.result_summary = evt.summary || ''; }
      }
      ctx.solverActiveStep = null;
      if (isActive) { patchPlanPanel(); queueSolverStepPatch(evt.step_id, { immediate: true }); }
      break;
    }
    case 'await_user_feedback': {
      ctx.pendingFeedback = evt.request && typeof evt.request === 'object' ? evt.request : null;
      ctx.streamFeedbackRequest = ctx.pendingFeedback ? { ...ctx.pendingFeedback } : null;
      ctx.streamFeedbackRequests = upsertFeedbackRequest(ctx.streamFeedbackRequests || [], ctx.streamFeedbackRequest);
      ctx.feedbackArgsText = ctx.pendingFeedback ? JSON.stringify(ctx.pendingFeedback.proposed_args || {}, null, 2) : '';
      ctx.feedbackComment = '';
      assignFeedbackToSolverStep(ctx.pendingFeedback);
      if (isActive) { patchStreamingFeedback(); patchInputState(); scrollToBottom(false, false); }
      break;
    }
    case 'plan_complete': {
      if (ctx.currentPlan) ctx.currentPlan.completed = true;
      if (isActive) patchPlanPanel();
      break;
    }
    case 'graph_visualize': {
      // 从 agent 的 visualize_subgraph 工具结果中获取可视化数据
      if (evt.data && evt.data.nodes && evt.data.links) {
        const vizData = {
          nodes: evt.data.nodes,
          edges: (evt.data.links || []).map(l => ({
            src: l.source, dst: l.target,
            source: l.source, target: l.target,
            weight: l.weight
          })),
          directed: evt.data.directed,
          num_nodes: evt.data.num_nodes,
          num_edges: evt.data.num_edges,
          highlights: evt.data.highlights,
          communities: evt.data.communities,
        };
        // 保存到全局以便旧逻辑兼容
        graphData = { success: true, ...vizData };
        // 将图数据追加到当前流式消息的 graphs 数组
        const lastMsg = ctx.messages[ctx.messages.length - 1];
        if (lastMsg) {
          if (!lastMsg.graphs) lastMsg.graphs = [];
          const graphId = 'ig-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
          lastMsg.graphs.push({ id: graphId, ...vizData, activeHighlights: {} });
          // 图渲染较重，放到下一帧，避免阻塞 SSE reader 继续消费后续 token。
          if (state.graphSidebarOpen) requestAnimationFrame(() => {
            try { onNewSidebarGraph(); } catch (e) { console.error('[graph sidebar render error]', e); }
          });
        }
        if (isActive) {
          const graphInfo = lastMsg?.graphs?.[lastMsg.graphs.length - 1];
          requestAnimationFrame(() => {
            try {
              // 将图卡片插入 streaming-graphs 容器（位于 streaming-content 之前），
              // 保证流式过程中图在文字上方，与刷新后静态渲染顺序一致。
              const graphsContainer = document.getElementById('streaming-graphs')
                || document.getElementById('streaming-bubble')
                || document.querySelector('.msg-row.agent:last-child .bubble-agent');
              if (!graphsContainer || !graphInfo) return;
              const cardHtml = buildInlineGraphCardHtml(graphInfo);
              const temp = document.createElement('div');
              temp.innerHTML = cardHtml;
              const card = temp.firstElementChild;
              if (!card) return;
              graphsContainer.appendChild(card);
              // 初始化该卡片的 D3 图
              setTimeout(() => {
                try { renderInlineGraph(graphInfo); } catch (e) { console.error('[inline graph render error]', e); }
              }, 50);
              scrollToBottom(false, false);
            } catch (e) {
              console.error('[graph_visualize event error]', e);
            }
          });
        }
      }
      break;
    }
    case 'done': {
      ctx.hasGraph = evt.has_graph;
      if (evt.context_usage) ctx.contextUsage = normalizeContextUsage(evt.context_usage);
      ctx.contextCompressing = false;
      clearScheduledSolverPatch();
      const last = ctx.messages[ctx.messages.length - 1];
      if (last && last.streaming) {
        const feedbackRequests = mergeFeedbackRequests(ctx.streamFeedbackRequests, ctx.streamFeedbackRequest, ctx.pendingFeedback);
        const topLevelFeedbackRequests = [];
        for (const req of feedbackRequests) {
          if (feedbackStepId(req) !== null && assignFeedbackToSolverStep(req)) continue;
          topLevelFeedbackRequests.push({ ...req });
        }
        last.content = ctx.streamBuf; last.tools = [...ctx.streamTools];
        last.progressItems = (ctx.streamProgressItems || []).map(item => ({ ...item, progress: { ...(item.progress || {}) } }));
        last.thinking = [...ctx.streamThinking];
        last.plan = ctx.currentPlan ? { ...ctx.currentPlan } : null;
        last.solverSteps = [...ctx.solverSteps];
        last.feedbackRequests = topLevelFeedbackRequests;
        last.feedbackRequest = null;
        last.streaming = false;
      }
      ctx.modelTurnCheckpoint = null;
      if (isActive) { state.contextUsage = ctx.contextUsage || state.contextUsage; state.contextCompressing = false; finalizeStreamingBubble(); patchGraphBadge(); patchContextMeter(); patchSessionNotice(); }
      break;
    }
    case 'error': {
      clearScheduledSolverPatch();
      ctx.contextCompressing = false;
      const errLast = ctx.messages[ctx.messages.length - 1];
      if (errLast && errLast.streaming) { errLast.content = evt.error; errLast.tools = []; errLast.progressItems = []; errLast.thinking = []; errLast.streaming = false; }
      ctx.modelTurnCheckpoint = null;
      if (isActive) {
        state.contextCompressing = false;
        patchContextMeter();
        patchSessionNotice();
        const ec = document.getElementById('streaming-content');
        if (ec) ec.innerHTML = `<span style="color:var(--red)">❌ ${esc(evt.error)}</span>`;
        for (const id of ['streaming-row','streaming-bubble','streaming-thinking','streaming-plan','streaming-solver','streaming-feedback','streaming-tools','streaming-progress','streaming-content']) {
          const el = document.getElementById(id); if (el) el.removeAttribute('id');
        }
      }
      break;
    }
  }
}

// ── Stream chat ────────────────────────────────────────────────────
async function doStreamChat(message, attachments = [], { regenerate = false } = {}) {
  _streamCtx = state; // always start in foreground
  _streamAbortController = new AbortController();
  state.messages.push({ role: 'assistant', content: '', tools: [], progressItems: [], streaming: true });
  state.streamBuf = ''; state.streamTools = []; state.streamProgressItems = []; state.streamThinking = [];
  state.contextCompressing = false;
  state.streamFeedbackRequest = null;
  state.streamFeedbackRequests = [];
  state.streamThinkingPhase = null; state.modelTurnCheckpoint = null;
  state.planAnalyzing = false; state.solverSteps = []; state.solverActiveStep = null;
  render();
  try {
    const res = await apiFetch(`${API_BASE}/api/sessions/${state.sessionId}/chat/stream`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, attachments: attachments.length ? attachments : undefined, reasoning_mode: state.reasoningMode, planning_mode: state.planningMode, regenerate }),
      signal: _streamAbortController.signal,
    });
    if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader(); const decoder = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (!raw) continue;
        try { handleSseEvent(JSON.parse(raw)); } catch(e) { console.error('[SSE handle error]', e, 'raw:', raw?.slice(0,200)); }
      }
    }
  } catch (e) {
    clearScheduledSolverPatch();
    const ctx = _streamCtx || state;
    ctx.contextCompressing = false;
    if (e.name === 'AbortError') {
      // User manually stopped (session-switch moves to bg instead of aborting)
      const last = ctx.messages[ctx.messages.length - 1];
      if (last && last.streaming) {
        const feedbackRequests = mergeFeedbackRequests(ctx.streamFeedbackRequests, ctx.streamFeedbackRequest, ctx.pendingFeedback);
        const topLevelFeedbackRequests = [];
        for (const req of feedbackRequests) {
          if (feedbackStepId(req) !== null && assignFeedbackToSolverStep(req)) continue;
          topLevelFeedbackRequests.push({ ...req });
        }
        last.content = ctx.streamBuf; last.tools = [...ctx.streamTools];
        last.progressItems = (ctx.streamProgressItems || []).map(item => ({ ...item, progress: { ...(item.progress || {}) } }));
        last.thinking = ctx.streamThinking.map(t => ({ ...t, streaming: false }));
        last.streaming = false;
        last.solverSteps = [...ctx.solverSteps];
        last.feedbackRequests = topLevelFeedbackRequests;
        last.feedbackRequest = null;
      }
      if (ctx === state) { state.contextCompressing = false; finalizeStreamingBubble(); patchContextMeter(); patchSessionNotice(); }
    } else {
      const last = ctx.messages[ctx.messages.length - 1];
      if (last && last.streaming) { last.content = e.message; last.tools = []; last.progressItems = []; last.thinking = []; last.streaming = false; }
      if (ctx === state) {
        state.contextCompressing = false;
        patchContextMeter();
        patchSessionNotice();
        const ec = document.getElementById('streaming-content');
        if (ec) ec.innerHTML = `<span style="color:var(--red)">❌ 网络错误：${esc(e.message)}</span>`;
        for (const id of ['streaming-row','streaming-bubble','streaming-thinking','streaming-plan','streaming-solver','streaming-feedback','streaming-tools','streaming-progress','streaming-content']) {
          const el = document.getElementById(id); if (el) el.removeAttribute('id');
        }
      }
    }
  } finally {
    _streamAbortController = null;
    if (_streamCtx === state) {
      // Foreground stream ended (completed or user-stopped)
      state.loading = false; patchInputState();
      if (!state.switchingSession) await refreshSessionList();
    } else {
      // Background stream ended — mark done, reset ctx, refresh sidebar
      _streamCtx._done = true;
      _streamCtx = state;
      await refreshSessionList();
    }
  }
}

async function doFeedbackResume(payload) {
  _streamAbortController = new AbortController();
  state.contextCompressing = false;
  const preservedFeedback = state.streamFeedbackRequest ? { ...state.streamFeedbackRequest } : null;
  const preservedFeedbackRequests = mergeFeedbackRequests(state.streamFeedbackRequests, state.streamFeedbackRequest);
  const preservedSolverSteps = state.solverSteps.map(s => ({ ...s }));
  // 在原气泡中继续输出，而不是创建新气泡
  const lastMsg = state.messages[state.messages.length - 1];
  if (lastMsg && lastMsg.role === 'assistant') {
    if (!lastMsg.streaming) {
      state.streamBuf = lastMsg.content || '';
      // finalizeStreamingBubble marks all streamTools done:true even for tools interrupted by
      // feedback (train never actually ran). Reset done for the specific tool being resumed so
      // it renders as running, not complete.
      const pendingCallId = preservedFeedback ? String(preservedFeedback.call_id || '') : '';
      const pendingToolName = preservedFeedback ? toolNameOf(preservedFeedback.proposed_tool || preservedFeedback.tool || '') : '';
      state.streamTools = (lastMsg.tools || []).map(t => ({
        ...t,
        done: (pendingCallId && sameToolCall(t, pendingToolName, pendingCallId)) ? false : t.done,
      }));
      state.streamProgressItems = (lastMsg.progressItems || lastMsg.progress_items || []).map(item => ({ ...item, progress: { ...(item.progress || {}) } }));
      state.streamThinking = (lastMsg.thinking || []).map(t => ({ ...t, streaming: false }));
      state.currentPlan = lastMsg.plan ? { ...lastMsg.plan } : state.currentPlan;
      state.solverSteps = (lastMsg.solverSteps || []).map(s => ({
        ...s,
        tools: Array.isArray(s.tools) ? s.tools.map(t => ({
          ...t,
          done: (pendingCallId && sameToolCall(t, pendingToolName, pendingCallId)) ? false : t.done,
        })) : [],
        progressItems: (s.progressItems || s.progress_items || []).map(item => ({ ...item, progress: { ...(item.progress || {}) } })),
      }));
    } else if (!state.solverSteps.length && preservedSolverSteps.length) {
      state.solverSteps = preservedSolverSteps;
    }
    state.streamFeedbackRequests = mergeFeedbackRequests(preservedFeedbackRequests, lastMsg.feedbackRequests, lastMsg.feedbackRequest);
    state.streamFeedbackRequest = preservedFeedback
      || (lastMsg.feedbackRequest ? { ...lastMsg.feedbackRequest } : null)
      || feedbackFromSolverSteps(state.solverSteps);
    lastMsg.streaming = true;
  } else {
    state.messages.push({ role: 'assistant', content: '', tools: [], progressItems: [], streaming: true });
    state.streamBuf = ''; state.streamTools = []; state.streamProgressItems = []; state.streamThinking = [];
    state.streamFeedbackRequest = preservedFeedback;
    state.streamFeedbackRequests = preservedFeedbackRequests;
    state.currentPlan = null; state.solverSteps = [];
  }
  state.streamThinkingPhase = null; state.modelTurnCheckpoint = null;
  state.planAnalyzing = false; state.solverActiveStep = null;
  render();
  // 用已有内容填充流式区域（续写，非从零开始）
  const contentEl = document.getElementById('streaming-content');
  if (contentEl && state.streamBuf) {
    contentEl.innerHTML = md(state.streamBuf) + '<span class="cursor"></span>';
    renderMathIn(contentEl);
  }
  patchStreamingThinking();
  patchStreamingTools();
  patchStreamingProgress();
  patchStreamingFeedback();
  try {
    const res = await apiFetch(`${API_BASE}/api/sessions/${state.sessionId}/feedback/stream`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: _streamAbortController.signal,
    });
    if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader(); const decoder = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (!raw) continue;
        try { handleSseEvent(JSON.parse(raw)); } catch {}
      }
    }
  } catch (e) {
    clearScheduledSolverPatch();
    state.contextCompressing = false;
    if (e.name === 'AbortError') {
      const last = state.messages[state.messages.length - 1];
      if (last && last.streaming) {
        const feedbackRequests = mergeFeedbackRequests(state.streamFeedbackRequests, state.streamFeedbackRequest, state.pendingFeedback);
        const topLevelFeedbackRequests = [];
        for (const req of feedbackRequests) {
          if (feedbackStepId(req) !== null && assignFeedbackToSolverStep(req)) continue;
          topLevelFeedbackRequests.push({ ...req });
        }
        last.content = state.streamBuf; last.tools = [...state.streamTools];
        last.progressItems = (state.streamProgressItems || []).map(item => ({ ...item, progress: { ...(item.progress || {}) } }));
        last.thinking = state.streamThinking.map(t => ({ ...t, streaming: false }));
        last.streaming = false;
        last.solverSteps = [...state.solverSteps];
        last.feedbackRequests = topLevelFeedbackRequests;
        last.feedbackRequest = null;
      }
      finalizeStreamingBubble();
      patchContextMeter();
      patchSessionNotice();
    } else {
      const last = state.messages[state.messages.length - 1];
      if (last && last.streaming) { last.content = e.message; last.tools = []; last.thinking = []; last.streaming = false; }
      const ec = document.getElementById('streaming-content');
      patchContextMeter();
      patchSessionNotice();
      if (ec) ec.innerHTML = `<span style="color:var(--red)">❌ 网络错误：${esc(e.message)}</span>`;
      for (const id of ['streaming-row','streaming-bubble','streaming-thinking','streaming-plan','streaming-solver','streaming-feedback','streaming-tools','streaming-progress','streaming-content']) {
        const el = document.getElementById(id); if (el) el.removeAttribute('id');
      }
    }
  } finally {
    _streamAbortController = null;
    state.loading = false; patchInputState();
    if (!state.switchingSession) await refreshSessionList();
  }
}

// ── API calls ──────────────────────────────────────────────────────
function normalizeGraphInfo(value, fallbackId = '0') {
  if (!value || typeof value !== 'object') return null;
  const nodes = Array.isArray(value.nodes) ? value.nodes : [];
  const rawEdges = Array.isArray(value.edges)
    ? value.edges
    : (Array.isArray(value.links) ? value.links : []);
  if (!nodes.length || !Array.isArray(rawEdges)) return null;
  const edges = rawEdges
    .filter(e => e && typeof e === 'object')
    .map(e => {
      const src = e.src ?? e.source;
      const dst = e.dst ?? e.target;
      if (src === undefined || src === null || dst === undefined || dst === null) return null;
      return {
        src, dst,
        source: src,
        target: dst,
        weight: e.weight,
      };
    })
    .filter(Boolean);
  const nodeCount = Number(value.num_nodes ?? value.numNodes);
  const edgeCount = Number(value.num_edges ?? value.numEdges);
  const graph = {
    id: String(value.id || `ig-restored-${fallbackId}`),
    nodes: nodes.map(n => (n && typeof n === 'object') ? { ...n } : { id: String(n), label: String(n) }),
    edges,
    directed: value.directed !== false,
    num_nodes: Number.isFinite(nodeCount) ? nodeCount : nodes.length,
    num_edges: Number.isFinite(edgeCount) ? edgeCount : edges.length,
    activeHighlights: (value.activeHighlights && typeof value.activeHighlights === 'object') ? { ...value.activeHighlights } : {},
  };
  if (Array.isArray(value.highlights)) {
    graph.highlights = value.highlights
      .filter(h => h && typeof h === 'object')
      .map(h => ({ ...h }));
  }
  const communities = value.communities || value.community;
  if (communities && typeof communities === 'object') graph.communities = { ...communities };
  for (const key of ['truncated', 'total_nodes', 'truncated_to']) {
    if (key in value) graph[key] = value[key];
  }
  return graph;
}

function normalizeChatMessages(rows) {
  if (!Array.isArray(rows)) return [];
  const normalized = rows.filter(m => m && (m.role === 'user' || m.role === 'assistant')).map((m, rowIndex) => {
    const row = { role: m.role, content: String(m.content || '') };
    if (m.role === 'assistant') {
      if (Array.isArray(m.tools)) row.tools = m.tools.map(normalizeToolItem).filter(Boolean);
      if (Array.isArray(m.progressItems || m.progress_items)) {
        row.progressItems = (m.progressItems || m.progress_items)
          .filter(item => item && typeof item === 'object')
          .map(item => ({ ...item, tool: String(item.tool || ''), progress: { ...(item.progress || {}) } }))
          .filter(item => item.tool);
      }
      if (Array.isArray(m.thinking)) row.thinking = m.thinking.filter(t => t && typeof t === 'object').map(t => ({ phase: String(t.phase || 'thinking'), text: String(t.text || ''), streaming: false })).filter(t => t.text.trim());
      if (m.plan && typeof m.plan === 'object') row.plan = m.plan;
      if (Array.isArray(m.solverSteps)) {
        row.solverSteps = m.solverSteps.map(step => ({
          ...step,
          tools: Array.isArray(step.tools) ? step.tools.map(normalizeToolItem).filter(Boolean) : [],
          progressItems: (step.progressItems || step.progress_items || []).map(item => ({ ...item, progress: { ...(item.progress || {}) } })),
          feedbackRequests: mergeFeedbackRequests(step.feedbackRequests || step.feedback_requests, step.feedbackRequest || step.feedback_request),
          feedbackRequest: null,
        }));
      }
      row.feedbackRequests = mergeFeedbackRequests(
        m.feedbackRequests || m.feedback_requests,
        m.feedbackRequest || m.feedback_request,
      );
      if (Array.isArray(m.graphs)) {
        row.graphs = m.graphs
          .map((g, graphIndex) => normalizeGraphInfo(g, `${rowIndex}-${graphIndex}`))
          .filter(Boolean);
      }
      if (row.feedbackRequests.length && Array.isArray(row.solverSteps)) {
        const topLevel = [];
        for (const req of row.feedbackRequests) {
          const target = feedbackStepId(req) !== null
            ? row.solverSteps.find(step => Number(step.step_id) === feedbackStepId(req))
            : null;
          if (target) target.feedbackRequests = mergeFeedbackRequests(target.feedbackRequests, req);
          else topLevel.push(req);
        }
        row.feedbackRequests = topLevel;
      }
      if (Array.isArray(row.progressItems) && Array.isArray(row.solverSteps)) {
        const topLevelProgress = [];
        for (const item of row.progressItems) {
          const stepId = eventStepId(item);
          const target = stepId !== null
            ? row.solverSteps.find(step => Number(step.step_id) === Number(stepId))
            : null;
          if (target) {
            if (!Array.isArray(target.progressItems)) target.progressItems = [];
            upsertProgressItem(target.progressItems, item);
          } else {
            topLevelProgress.push(item);
          }
        }
        row.progressItems = topLevelProgress;
      }
    }
    return row;
  });
  return mergeAssistantContinuations(normalized);
}

function mergeAssistantContinuations(rows) {
  const merged = [];
  for (const row of rows) {
    const prev = merged[merged.length - 1];
    if (prev && prev.role === 'assistant' && row.role === 'assistant') {
      prev.content = [prev.content, row.content].filter(Boolean).join(prev.content && row.content ? '\n\n' : '');
      if (Array.isArray(row.tools) && row.tools.length) prev.tools = row.tools;
      if (Array.isArray(row.progressItems) && row.progressItems.length) prev.progressItems = row.progressItems;
      if (Array.isArray(row.thinking) && row.thinking.length) prev.thinking = row.thinking;
      if (row.plan) prev.plan = row.plan;
      if (Array.isArray(row.solverSteps) && row.solverSteps.length) prev.solverSteps = mergeSolverSteps(prev.solverSteps || [], row.solverSteps);
      if (Array.isArray(row.graphs) && row.graphs.length) prev.graphs = [...(prev.graphs || []), ...row.graphs];
      const rowFeedback = normalizeFeedbackRequests(row.feedbackRequests || row.feedbackRequest);
      const topLevel = [];
      for (const req of rowFeedback) {
        const target = feedbackStepId(req) !== null && Array.isArray(prev.solverSteps)
          ? prev.solverSteps.find(step => Number(step.step_id) === feedbackStepId(req))
          : null;
        if (target) target.feedbackRequests = mergeFeedbackRequests(target.feedbackRequests, req);
        else topLevel.push(req);
      }
      prev.feedbackRequests = mergeFeedbackRequests(prev.feedbackRequests || prev.feedbackRequest, topLevel);
      prev.feedbackRequest = null;
      continue;
    }
    merged.push(row);
  }
  return merged;
}

async function refreshSessionList() {
  state.sessionsLoading = true; render();
  try {
    const res = await apiFetch(`${API_BASE}/api/sessions`);
    const data = await res.json();
    if (res.ok && data.success) { state.sessions = Array.isArray(data.sessions) ? data.sessions : []; state.error = null; }
    else throw new Error(data.detail || data.error || '获取会话列表失败');
  } catch (err) { state.error = err.message || '获取会话列表失败'; }
  finally { state.sessionsLoading = false; render(); }
}

async function createSession({ activate = true } = {}) {
  if (state.creating) return;
  state.creating = true; state.error = null; state.sessionNotice = null; state.contextCompressing = false; render();
  try {
    const res = await apiFetch(`${API_BASE}/api/sessions`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: normalizeModelName(state.model, state.defaultModel), reasoning_mode: state.reasoningMode, planning_mode: state.planningMode }),
    });
    const data = await res.json();
    if (data.success) {
      applyModelAccess(data);
      state.sessionId = data.session_id; state.messages = []; state.currentPlan = null; state.hasGraph = false;
      state.contextCompressing = false;
      state.pendingFeedback = null; state.feedbackArgsText = ''; state.feedbackComment = '';
      state.streamFeedbackRequest = null; state.streamFeedbackRequests = [];
      setContextUsage(data.context_usage);
      syncModelSelect(data.model);
      state.reasoningMode = data.reasoning_mode || state.reasoningMode;
      state.planningMode  = data.planning_mode  || state.planningMode;
      state.sessionNotice = null;
      await refreshSessionList();
      if (!activate) return;
    } else state.error = data.detail || '创建会话失败';
  } catch { state.error = `无法连接后端 ${API_BASE}`; }
  finally { state.creating = false; render(); }
}

async function startNewSession() {
  if (state.creating || state.loading || state.switchingSession) return;
  await createSession({ activate: true });
}

async function deleteSession(sessionId) {
  const sid = String(sessionId || '').trim();
  if (!sid || state.loading || state.switchingSession) return;
  if (!confirm(`确认删除会话 #${sid}？\n此操作不可撤销。`)) return;
  const wasActive = sid === state.sessionId;
  try {
    const res = await apiFetch(`${API_BASE}/api/sessions/${sid}`, { method: 'DELETE' });
    if (!res.ok) { const data = await res.json().catch(() => ({})); throw new Error(data.detail || data.error || '删除失败'); }
    if (wasActive) { state.sessionId = null; state.messages = []; state.currentPlan = null; state.hasGraph = false; state.sessionNotice = null; state.contextCompressing = false; }
    if (wasActive) { state.pendingFeedback = null; state.streamFeedbackRequest = null; state.streamFeedbackRequests = []; state.feedbackArgsText = ''; state.feedbackComment = ''; }
    await refreshSessionList();
    if (wasActive) {
      if (state.sessions.length > 0) await activateSession(state.sessions[0].session_id);
      else await createSession({ activate: true });
    }
  } catch (err) { state.error = err.message || '删除失败'; render(); }
}

async function activateSession(sessionId) {
  const sid = String(sessionId || '').trim();
  if (!sid || sid === state.sessionId || state.switchingSession || state.creating) return;

  // Move active stream to background instead of aborting it
  if (state.loading && _streamAbortController) {
    const bgCtx = _makeBgCtx();
    _bgSessions.set(state.sessionId, bgCtx);
    _streamCtx = bgCtx; // redirect subsequent SSE events to background context
    clearScheduledSolverPatch();
    state.loading = false; state.streamBuf = ''; state.streamTools = []; state.streamProgressItems = []; state.streamThinking = [];
    state.contextCompressing = false;
    state.streamThinkingPhase = null; state.currentPlan = null; state.planAnalyzing = false;
    state.solverSteps = []; state.solverActiveStep = null; state.modelTurnCheckpoint = null;
    state.pendingFeedback = null; state.streamFeedbackRequest = null; state.streamFeedbackRequests = []; state.feedbackArgsText = ''; state.feedbackComment = '';
  }

  state.switchingSession = true; state.error = null; state.sessionNotice = null; state.contextCompressing = false; render();
  try {
    const res = await apiFetch(`${API_BASE}/api/sessions/${sid}/activate`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.detail || data.error || '会话切换失败');
    applyModelAccess(data);
    state.sessionId = data.session_id;

    const bgCtx = _bgSessions.get(sid);
    if (bgCtx) {
      _bgSessions.delete(sid);
      if (!bgCtx._done) {
        // Stream still in progress — adopt it back to foreground
        _adoptBgCtx(bgCtx); // restores all stream state, sets state.loading = true, _streamCtx = state
      } else {
        // Stream completed in background — show its final messages
        state.messages = bgCtx.messages;
        state.contextCompressing = false;
        state.currentPlan = null;
        state.pendingFeedback = data.pending_feedback && typeof data.pending_feedback === 'object' ? data.pending_feedback : null;
        state.streamFeedbackRequest = state.pendingFeedback ? { ...state.pendingFeedback } : null;
        state.streamFeedbackRequests = normalizeFeedbackRequests(state.streamFeedbackRequest);
        state.feedbackArgsText = state.pendingFeedback ? JSON.stringify(state.pendingFeedback.proposed_args || {}, null, 2) : '';
        state.feedbackComment = '';
      }
    } else {
      state.messages = normalizeChatMessages(data.messages);
      state.contextCompressing = false;
      state.currentPlan = null;
      state.pendingFeedback = data.pending_feedback && typeof data.pending_feedback === 'object' ? data.pending_feedback : null;
      state.streamFeedbackRequest = state.pendingFeedback ? { ...state.pendingFeedback } : null;
      state.streamFeedbackRequests = normalizeFeedbackRequests(state.streamFeedbackRequest);
      state.feedbackArgsText = state.pendingFeedback ? JSON.stringify(state.pendingFeedback.proposed_args || {}, null, 2) : '';
      state.feedbackComment = '';
    }

    state.hasGraph = !!data.has_graph;
    setContextUsage(data.context_usage);
    syncModelSelect(data.model);
    state.reasoningMode = data.reasoning_mode || state.reasoningMode;
    state.planningMode  = data.planning_mode  || 'auto';
    const _compressions = Number((state.contextUsage || {}).compression_count || 0);
    state.sessionNotice = data.requires_graph_reload
      ? '该历史会话的图状态无法自动恢复，如需继续图计算请重新加载图数据。'
      : _compressions > 0
        ? `已自动压缩 ${_compressions} 次较早会话上下文，完整聊天记录仍保留在界面中。`
        : null;
    state.error = null;
    await refreshSessionList();
  } catch (err) { state.error = err.message || '会话切换失败'; }
  finally { state.switchingSession = false; render(); }
}

async function handleModelChange(e) {
  const nextModel = normalizeModelName(e.target.value, state.model);
  const prevModel = state.model;
  syncModelSelect(nextModel);
  if (!state.sessionId) return;
  state.switchingModel = true; render();
  try {
    const res = await apiFetch(`${API_BASE}/api/sessions/${state.sessionId}/model`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: nextModel }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.detail || data.error || '模型切换失败');
    applyModelAccess(data);
    syncModelSelect(data.model || nextModel); state.error = null;
    await refreshSessionList();
  } catch (err) { syncModelSelect(prevModel); state.error = err.message || '模型切换失败'; }
  finally { state.switchingModel = false; syncModelSelect(state.model); render(); }
}

async function toggleReasoningMode() {
  if (!state.sessionId || state.loading || state.creating || state.switchingReasoning || state.switchingSession) return;
  const nextMode = state.reasoningMode === 'staged' ? 'direct' : 'staged';
  const prevMode = state.reasoningMode;
  state.switchingReasoning = true; state.error = null;
  patchReasoningButton(); patchInputState(); patchErrorBanner();
  try {
    const res = await apiFetch(`${API_BASE}/api/sessions/${state.sessionId}/reasoning-mode`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reasoning_mode: nextMode }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.detail || data.error || '推理模式切换失败');
    state.reasoningMode = data.reasoning_mode || nextMode; state.error = null;
  } catch (err) { state.reasoningMode = prevMode; state.error = err.message || '推理模式切换失败'; }
  finally { state.switchingReasoning = false; patchReasoningButton(); patchInputState(); patchErrorBanner(); }
}

async function togglePlanningMode() {
  if (!state.sessionId || state.loading || state.creating || state.switchingPlanning || state.switchingSession) return;
  const cycle = { auto: 'always', always: 'never', never: 'auto' };
  const nextMode = cycle[state.planningMode] || 'auto';
  const prevMode = state.planningMode;
  state.switchingPlanning = true; state.error = null;
  patchPlanningButton(); patchInputState(); patchErrorBanner();
  try {
    const res = await apiFetch(`${API_BASE}/api/sessions/${state.sessionId}/planning-mode`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ planning_mode: nextMode }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.detail || data.error || '规划模式切换失败');
    state.planningMode = data.planning_mode || nextMode; state.error = null;
  } catch (err) { state.planningMode = prevMode; state.error = err.message || '规划模式切换失败'; }
  finally { state.switchingPlanning = false; patchPlanningButton(); patchInputState(); patchErrorBanner(); }
}

let _nodeCardCurrentId = null; // id of node whose card is shown
let _nodeCardData = null;      // cached node data for the current card

// 友好的属性 key 映射，未知 key 直接展示原始名
const _NODE_ATTR_LABELS = {
  type:  '类型',
  label: '标签',
  text:  '文本',
  category: '类别',
  class: '分类',
  feature: '特征',
  weight: '权重',
  score: '评分',
  color: '颜色',
  size:  '大小',
  desc:  '描述',
  description: '描述',
  group: '分组',
  community: '社区',
  tag:   '标签',
};

function _renderAttrValue(val) {
  if (val === null || val === undefined) return '—';
  if (Array.isArray(val)) {
    if (val.length === 0) return '—';
    // one-hot / float array → show argmax index
    if (typeof val[0] === 'number') {
      const max = Math.max(...val);
      return val.length <= 6
        ? '[' + val.map(v => typeof v === 'number' ? v.toFixed(2) : v).join(', ') + ']'
        : `argmax=${val.indexOf(max)} (${val.length}维)`;
    }
    return val.slice(0, 4).join(', ') + (val.length > 4 ? ` …+${val.length - 4}` : '');
  }
  if (typeof val === 'number') return Number.isInteger(val) ? String(val) : val.toFixed(4);
  const s = String(val);
  return s.length > 120 ? s.slice(0, 120) + '…' : s;
}

function showNodeCard(nodeData, screenX, screenY) {
  hideNodeCard();
  const { id, label, in_degree = 0, out_degree = 0, neighbors = [], attrs = null, nbEdges = null } = nodeData;
  const name = label || id;
  const totalDeg = in_degree + out_degree;
  const isAlreadyRef = state.nodeRefs.some(r => r.id === id);

  // Cache node data so the button handler can access it safely (avoids HTML-escaping issues)
  _nodeCardCurrentId = id;
  _nodeCardData = { id, label: name, in_degree, out_degree, neighbors, attrs };

  const card = document.createElement('div');
  card.id = 'node-card';

  const initials = name.slice(0, 2).toUpperCase();
  const neighborPreview = neighbors.slice(0, 6).join(', ') + (neighbors.length > 6 ? ` … +${neighbors.length - 6}` : '');

  // Build attrs rows (generic, works for any key)
  const attrRows = [];

  // 如果 label 和 id 不同，把 id 也展示出来
  if (id !== name) {
    attrRows.push(`<div class="node-card-attr-row">
      <span class="node-card-attr-key">ID</span>
      <span class="node-card-attr-val">${esc(id)}</span>
    </div>`);
  }

  // 自定义属性（type / label / text / …）
  if (attrs && typeof attrs === 'object') {
    Object.entries(attrs)
      .filter(([, v]) => v !== null && v !== undefined && v !== '')
      .forEach(([k, v]) => {
        const keyLabel = _NODE_ATTR_LABELS[k] || k;
        const valStr = _renderAttrValue(v);
        const isLong = valStr.length > 30;
        attrRows.push(isLong
          ? `<div class="node-card-attr-row full">
               <span class="node-card-attr-key">${esc(keyLabel)}</span>
               <span class="node-card-attr-val long">${esc(valStr)}</span>
             </div>`
          : `<div class="node-card-attr-row">
               <span class="node-card-attr-key">${esc(keyLabel)}</span>
               <span class="node-card-attr-val">${esc(valStr)}</span>
             </div>`);
      });
  }

  // 邻居列表（带权重，展示最多 20 个）
  if (neighbors.length > 0) {
    let nbText;
    if (nbEdges && nbEdges.length > 0) {
      // 有权重信息时显示 "邻居(权重)" 格式
      const hasWeight = nbEdges.some(e => e.weight != null && e.weight !== 1);
      const items = nbEdges.slice(0, 20).map(e =>
        hasWeight ? `${e.neighbor}(${typeof e.weight === 'number' ? e.weight.toFixed(2) : e.weight})` : e.neighbor
      );
      nbText = items.join(', ') + (nbEdges.length > 20 ? ` …+${nbEdges.length - 20}` : '');
    } else {
      nbText = neighbors.slice(0, 20).join(', ') + (neighbors.length > 20 ? ` …+${neighbors.length - 20}` : '');
    }
    attrRows.push(`<div class="node-card-attr-row full">
      <span class="node-card-attr-key">邻居</span>
      <span class="node-card-attr-val long">${esc(nbText)}</span>
    </div>`);
  }

  const attrsHtml = attrRows.length > 0
    ? `<div class="node-card-attrs">${attrRows.join('')}</div>`
    : '';

  card.innerHTML = `
    <div class="node-card-header">
      <div class="node-card-icon">${esc(initials)}</div>
      <div class="node-card-name" title="${esc(name)}">${esc(name)}</div>
      <button class="node-card-close" onclick="hideNodeCard()">×</button>
    </div>
    <div class="node-card-stats">
      <div class="node-card-stat">
        <span class="node-card-stat-val">${in_degree}</span>
        <span class="node-card-stat-lbl">入度</span>
      </div>
      <div class="node-card-stat">
        <span class="node-card-stat-val">${out_degree}</span>
        <span class="node-card-stat-lbl">出度</span>
      </div>
      <div class="node-card-stat">
        <span class="node-card-stat-val">${totalDeg}</span>
        <span class="node-card-stat-lbl">总度</span>
      </div>
    </div>
    ${attrsHtml}
    <div class="node-card-footer">
      <button class="node-card-btn-ref${isAlreadyRef ? ' added' : ''}"
        id="node-card-ref-btn"
        onclick="addNodeRefFromCard()">
        ${isAlreadyRef ? '✓ 已加入上下文' : '+ 加入上下文'}
      </button>
    </div>
  `;

  document.body.appendChild(card);

  // Smart positioning: keep card within viewport
  const vw = window.innerWidth, vh = window.innerHeight;
  const cw = 280, ch = 220; // approx card size
  let left = screenX + 14;
  let top  = screenY - 10;
  if (left + cw > vw - 10) left = screenX - cw - 14;
  if (top + ch > vh - 10)  top  = vh - ch - 16;
  if (top < 8)             top  = 8;
  card.style.left = left + 'px';
  card.style.top  = top  + 'px';

  // Close on outside click (deferred so this event doesn't immediately close it)
  setTimeout(() => {
    document.addEventListener('click', _onOutsideNodeCardClick, { once: true, capture: true });
  }, 0);
}

function _onOutsideNodeCardClick(e) {
  const card = document.getElementById('node-card');
  if (card && !card.contains(e.target)) {
    hideNodeCard();
  } else if (card) {
    // Re-attach listener if click was inside card
    setTimeout(() => {
      document.addEventListener('click', _onOutsideNodeCardClick, { once: true, capture: true });
    }, 0);
  }
}

function hideNodeCard() {
  const card = document.getElementById('node-card');
  if (card) card.remove();
  _nodeCardCurrentId = null;
}

// Called by the button inside the node card; reads from the cached _nodeCardData
function addNodeRefFromCard() {
  if (!_nodeCardData) return;
  addNodeRef(_nodeCardData);
}

function _nodeRefBarHtml() {
  if (!state.nodeRefs.length) return '';
  return `<div id="node-ref-bar">
    <span class="node-ref-label">引用节点:</span>
    ${state.nodeRefs.map(n => `
      <span class="node-ref-chip" title="度数: ${n.in_degree + n.out_degree}">
        <span>⬡ ${esc(n.label || n.id)}</span>
        <button class="node-ref-chip-remove" onclick="removeNodeRef('${esc(n.id)}')" title="移除">×</button>
      </span>
    `).join('')}
    <button class="node-ref-clear" onclick="clearNodeRefs()">清除全部</button>
  </div>`;
}

function patchNodeRefBar() {
  const existing = document.getElementById('node-ref-bar');
  const html = _nodeRefBarHtml();
  if (html) {
    if (existing) {
      existing.outerHTML = html;
    } else {
      // 插入到 input-row 前面
      const inputRow = document.querySelector('.input-row');
      if (inputRow) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        inputRow.parentElement.insertBefore(tmp.firstElementChild, inputRow);

    }
  } else {
    if (existing) existing.remove();
  }
}

function addNodeRef(nodeData) {

function markFeedbackRequestResolved(requestId, status, patchedArgs = null, comment = '') {
  if (!requestId) return;
  const resolveReq = req => ({
    ...req,
    status,
    patched_args: patchedArgs && typeof patchedArgs === 'object' ? patchedArgs : req.patched_args,
    comment: comment || req.comment || '',
  });
  for (const row of state.messages) {
    if (!row || row.role !== 'assistant') continue;
    if (row.feedbackRequest && String(row.feedbackRequest.request_id || '') === String(requestId)) {
      row.feedbackRequest = resolveReq(row.feedbackRequest);
    }
    row.feedbackRequests = normalizeFeedbackRequests(row.feedbackRequests || row.feedbackRequest).map(req =>
      String(req.request_id || '') === String(requestId) ? resolveReq(req) : req
    );
    if (Array.isArray(row.solverSteps)) {
      for (const step of row.solverSteps) {
        if (step.feedbackRequest && String(step.feedbackRequest.request_id || '') === String(requestId)) {
          step.feedbackRequest = resolveReq(step.feedbackRequest);
        }
        step.feedbackRequests = normalizeFeedbackRequests(step.feedbackRequests || step.feedbackRequest).map(req =>
          String(req.request_id || '') === String(requestId) ? resolveReq(req) : req
        );
      }
    }
  }
  updateSolverStepFeedbackRequest(requestId, resolveReq);
}

async function submitFeedbackResponse(decision) {
  if (!state.pendingFeedback || !state.sessionId || state.loading) return;
  let patchedArgs = null;
  if (decision === 'modify') {
    const requestId = String(state.pendingFeedback.request_id || '');
    const inputs = Array.from(document.querySelectorAll(`[data-feedback-args-input="${CSS.escape(requestId)}"]`));
    const dirtyInput = inputs.find(el => el.dataset.dirty === 'true');
    const argsText = dirtyInput?.value ?? state.feedbackArgsText ?? inputs[0]?.value ?? '{}';
    try { patchedArgs = JSON.parse(argsText || '{}'); }
    catch (err) { state.error = '修改后的参数不是合法 JSON'; render(); return; }
  }
  const request = state.pendingFeedback;
  const comment = String(state.feedbackComment || '').trim();
  const resolvedRequest = {
    ...request,
    status: decision,
    patched_args: patchedArgs && typeof patchedArgs === 'object' ? patchedArgs : request.patched_args,
    comment,
  };
  markFeedbackRequestResolved(request.request_id, decision, patchedArgs, comment);
  state.streamFeedbackRequest = resolvedRequest;
  state.streamFeedbackRequests = upsertFeedbackRequest(state.streamFeedbackRequests || [], resolvedRequest);
  assignFeedbackToSolverStep(resolvedRequest);
  state.pendingFeedback = null; state.feedbackArgsText = ''; state.feedbackComment = '';
  // 不额外创建用户气泡，直接在原气泡中续写（doFeedbackResume 会接管）
  state.loading = true; state.error = null;
  patchInputState();
  await doFeedbackResume({
    request_id: request.request_id,
    decision,
    patched_args: patchedArgs || undefined,
    comment,
  });
}

async function sendMessage() {
  const ta = $('#inp-chat');
  const text = ta ? ta.value.trim() : '';
  if (state.pendingFeedback) {
    state.error = '当前有待确认的高风险操作，请先处理确认卡片。';
    render();
    return;
  }
  if (!text || !state.sessionId || state.loading || state.switchingSession) return;

  // Build final message: prepend node references as structured context
  let finalText = text;
  if (state.nodeRefs.length > 0) {
    const refBlock = state.nodeRefs.map(n => `- 📍 ${n.label || n.id}`).join('\n');
    finalText = `[引用节点]\n${refBlock}\n\n${text}`;
    state.nodeRefs = [];
  }

  ta.value = ''; ta.style.height = '42px';
  state.messages.push({ role: 'user', content: finalText });
  state.currentPlan = null; state.autoScroll = true;
  state.sessionNotice = null; state.contextCompressing = false; state.loading = true; state.error = null;
  state.pendingFeedback = null; state.streamFeedbackRequest = null; state.streamFeedbackRequests = []; state.feedbackArgsText = ''; state.feedbackComment = '';
  await doStreamChat(finalText);
}

async function writeClipboardText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch {}
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    const ok = document.execCommand('copy');
    if (!ok) throw new Error('copy command failed');
  } finally {
    document.body.removeChild(ta);
  }
}

function setCopyButtonState(button, copied) {
  if (!button) return;
  button.classList.toggle('copied', !!copied);
  button.innerHTML = copied
    ? `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>已复制</span>`
    : `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>复制</span>`;
}

async function copyAssistantMessage(messageIndex, button) {
  const row = state.messages[Number(messageIndex)];
  const text = row && row.role === 'assistant' ? String(row.content || '') : '';
  if (!text) return;
  try {
    setCopyButtonState(button, true);
    await writeClipboardText(text);
    window.setTimeout(() => setCopyButtonState(button, false), 1400);
  } catch (e) {
    setCopyButtonState(button, false);
    console.error('[copy assistant message failed]', e);
    state.error = '复制失败，请手动选择内容复制';
    render();
  }
}

async function regenerateLastMessage() {
  if (state.loading || state.creating || state.switchingSession || !state.sessionId) return;
  let lastUserContent = '';
  for (let i = state.messages.length - 1; i >= 0; i--) {
    if (state.messages[i].role === 'user') { lastUserContent = state.messages[i].content; break; }
  }
  if (!lastUserContent) return;
  // 移除最后一条 assistant 消息，重新生成
  if (state.messages.length > 0 && state.messages[state.messages.length - 1].role === 'assistant') {
    state.messages.pop();
  }
  state.currentPlan = null; state.autoScroll = true;
  state.loading = true; state.error = null;
  state.pendingFeedback = null; state.streamFeedbackRequest = null; state.streamFeedbackRequests = []; state.feedbackArgsText = ''; state.feedbackComment = '';
  await doStreamChat(lastUserContent, [], { regenerate: true });
}

async function handleUpload(e) {
  const file = e.target.files?.[0];
  if (!file || !state.sessionId || state.switchingSession) return;
  state.uploading = true; state.error = null; render();
  try {
    const fd = new FormData(); fd.append('file', file);
    const res  = await apiFetch(`${API_BASE}/api/sessions/${state.sessionId}/upload`, { method: 'POST', body: fd });
    const data = await res.json();

      state.messages.push({ role: 'assistant', content: `已完成文件「${data.filename}」的上传，我可以运用图的专业知识帮你对其进行分析。`, tools: [], progressItems: [], thinking: [], streaming: false });
      state.autoScroll = true; state.uploading = false;
      const fi = $('#file-input'); if (fi) fi.value = '';
      render();
      return;
    }
    state.error = data.error || '上传失败';
  } catch { state.error = '上传失败，请检查网络'; }
  finally {
    state.uploading = false;
    const fi = $('#file-input'); if (fi) fi.value = '';
    render();
  }
}

// Convert any string to a valid skill name: lowercase, ASCII only,
// must start with a letter, length 3-64, only [a-z0-9_-].
function sanitizeSkillName(s) {
  let v = String(s || '')
    .toLowerCase()
    .replace(/[\s\-]+/g, '_')          // spaces/hyphens → underscore
    .replace(/[^a-z0-9_]/g, '_')       // anything else → underscore
    .replace(/_+/g, '_')               // collapse repeated underscores
    .replace(/^[^a-z]+/, '')           // strip leading non-letters
    .replace(/_+$/, '');               // strip trailing underscores
  if (!v || v.length < 3) v = 'skill_' + v;
  return v.slice(0, 64);
}

// ── LLM Skill Generation ───────────────────────────────────────────
async function mgmtPromoteWithLLM(itemIdx) {
  const item = _mgmtGetItem(itemIdx);
  if (!item) return;
  const pbId = item.playbook_id || item.memory_id || '';
  if (!pbId) { state.mgmtError = 'Playbook ID 不存在'; render(); return; }

  // Derive suggested name from problem_type
  const pbSuffix = pbId.slice(-8).toLowerCase().replace(/[^a-z0-9]/g, '') || 'gen';
  const rawBase = (item.problem_type || item.key || 'playbook_skill') + '_' + pbSuffix;
  const suggestedName = sanitizeSkillName(rawBase);

  state.mgmtGenerateState = {
    playbook: item,
    content: '',
    done: false,
    name: suggestedName,
    saving: false,
    error: null,
  };
  // Close any other overlays
  state.mgmtEditingSkill = null;
  state.mgmtShowCreate = false;
  state.mgmtShowPromote = false;
  state.mgmtError = null;
  render();

  // Stream from LLM
  try {
    const res = await apiFetch(`${API_BASE}/api/skills/generate-from-playbook`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ playbook_id: pbId, session_id: state.sessionId || '' }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || d.error || '请求失败');
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() ?? '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (!raw || raw === '[DONE]') continue;
        let evt;
        try { evt = JSON.parse(raw); } catch { continue; }
        if (!state.mgmtGenerateState) break;
        if (evt.type === 'token') {
          state.mgmtGenerateState.content += evt.content;
          // Direct DOM patch for smooth streaming
          const ta = document.getElementById('mgmt-gen-editor');
          if (ta) { ta.value = state.mgmtGenerateState.content; ta.scrollTop = ta.scrollHeight; }
        } else if (evt.type === 'done') {
          state.mgmtGenerateState.done = true;
          if (evt.suggested_name) state.mgmtGenerateState.name = evt.suggested_name;
          if (evt.full_content) state.mgmtGenerateState.content = evt.full_content;
          render();
        } else if (evt.type === 'error') {
          throw new Error(evt.error || '生成失败');
        }
      }
      if (state.mgmtGenerateState?.done) break;
    }
  } catch (e) {
    if (state.mgmtGenerateState) {
      state.mgmtGenerateState.error = String(e.message || e);
      state.mgmtGenerateState.done = true;
      render();
    }
  }
}

async function mgmtSaveGeneratedSkill() {
  const gs = state.mgmtGenerateState;

  const rawName = document.getElementById('mgmt-gen-name')?.value?.trim() || gs.name;

// ── Theme ──────────────────────────────────────────────────────────
function initTheme() {
  const saved = localStorage.getItem('ga-theme');
  const theme = saved || 'light';
  document.documentElement.setAttribute('data-theme', theme);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ga-theme', next);
  // update mermaid theme on-the-fly
  if (window.mermaid && window.__graphAgentMermaidInited) {
    window.mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: next === 'dark' ? 'dark' : 'default' });
    window.__graphAgentMermaidInited = true;
  }
}

// ── Boot ───────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const hdr = e.target.closest('.thinking-hdr');
  if (!hdr || hdr.classList.contains('streaming')) return;
  const block = hdr.closest('.thinking-block'); if (!block) return;
  const expanded = block.dataset.expanded === 'true';
  block.dataset.expanded = String(!expanded);
  const body = block.querySelector('.thinking-body');
  if (body) body.style.display = expanded ? 'none' : 'block';
});

async function bootstrap() {
  syncLayoutVars();
  initTheme();
  render();

  // ── Auth ────────────────────────────────────────────────────────────────
  const overlay  = document.getElementById('login-overlay');
  const loginBtn = document.getElementById('login-btn');
  const loginInput = document.getElementById('login-input');
  const loginError = document.getElementById('login-error');

  async function attemptLogin(userId) {
    loginBtn.disabled = true;
    loginError.textContent = '';
    const ok = await validateUser(userId);
    if (ok) {
      localStorage.setItem(_LS_USER_KEY, userId);
      localStorage.removeItem(_LS_LEGACY_USER_KEY);
      state.currentUserId = userId;
      overlay.classList.add('hidden');
      render();
      await startApp();
    } else {
      loginError.textContent = '用户 ID 无效，请联系管理员。';
      loginBtn.disabled = false;
      loginInput.focus();
    }
  }

  loginBtn.addEventListener('click', () => {
    const v = loginInput.value.trim();
    if (v) attemptLogin(v);
  });
  loginInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); loginBtn.click(); }
  });

  const savedId = getCurrentUserId();
  if (savedId) {
    const ok = await validateUser(savedId);
    if (ok) {
      overlay.classList.add('hidden');
      state.currentUserId = savedId;
      render();
      await startApp();
      return;
    } else {
      localStorage.removeItem(_LS_USER_KEY);
      localStorage.removeItem(_LS_LEGACY_USER_KEY);
      state.currentUserId = '';
    }
  }
  // Show login screen
  loginInput.focus();
}

async function startApp() {
  await refreshSessionList();
  if (state.sessions.length > 0) { await activateSession(state.sessions[0].session_id); return; }
  await createSession({ activate: true });
}
