let graphSimulation = null;
let graphSvg = null;
let graphData = null;
let currentLayout = 'force';
let showCommunity = false;


async function refreshGraphData() {
  if (!state.sessionId) return;
  try {
    const res = await apiFetch(`${API_BASE}/api/sessions/${state.sessionId}/graph/visualize`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ include_community: true }),
    });
    const data = await res.json();
    if (data.success) {
      graphData = data;
      renderGraph();
    } else {
      document.getElementById('node-info').innerHTML = '<span class="text-red-500">获取图数据失败</span>';
    }
  } catch (err) {
    document.getElementById('node-info').innerHTML = '<span class="text-red-500">加载失败: ' + err.message + '</span>';
  }
}

function setLayout(layout) {
  currentLayout = layout;
  document.getElementById('btn-layout-force').classList.toggle('active', layout === 'force');
  document.getElementById('btn-layout-circle').classList.toggle('active', layout === 'circle');
  if (graphData) renderGraph();
}

function toggleCommunityColor() {
  showCommunity = document.getElementById('chk-community').checked;
  if (graphData) renderGraph();
}

function resetGraphView() {
  if (graphSvg) {
    graphSvg.transition().duration(750).call(
      d3.zoom().transform,
      d3.zoomIdentity
    );
  }
}

function renderGraph() {
  if (!graphData || !graphData.nodes || !graphData.edges) return;
  
  const container = document.getElementById('graph-canvas');
  const width = container.clientWidth;
  const height = container.clientHeight;
  
  // Clear previous
  d3.select('#graph-svg').selectAll('*').remove();
  
  graphSvg = d3.select('#graph-svg')
    .attr('width', width)
    .attr('height', height);
  
  // Define arrow marker for directed edges
  const defs = graphSvg.append('defs');
  defs.append('marker')
    .attr('id', 'arrowhead')
    .attr('viewBox', '0 -5 10 10')
    .attr('refX', 20)
    .attr('refY', 0)
    .attr('markerWidth', 6)
    .attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-5L10,0L0,5')
    .attr('fill', '#94a3b8');
  
  // ── Large-graph sampling ──────────────────────────────────────────
  const allNodes = graphData.nodes.map(n => ({...n, id: n.id || n.label}));
  const allEdges = graphData.edges.map(e => ({src: e.src || e.source, dst: e.dst || e.target, source: e.src || e.source, target: e.dst || e.target}));
  const sampled = _sampleGraphForRender(allNodes, allEdges, _GRAPH_RENDER_LIMIT);
  graphData._truncated = sampled.truncated;
  graphData._renderedCount = sampled.renderedCount;
  // Show/hide sidebar truncation notice
  const sidebarNotice = document.getElementById('graph-sidebar-truncation-notice');
  if (sidebarNotice) {
    if (sampled.truncated) {
      sidebarNotice.textContent = `图共 ${graphData.nodes.length} 节点，当前展示度数最高的 ${sampled.renderedCount} 个节点。可向 Agent 提问查询局部子图。`;
      sidebarNotice.style.display = '';
    } else {
      sidebarNotice.style.display = 'none';
    }
  }
  // ─────────────────────────────────────────────────────────────────

  // Color scale for communities
  const numCommunities = Math.max(1, graphData.community?.num_communities || 1);
  const colorScale = d3.scaleOrdinal(d3.schemeCategory10);
  
  // Create simulation
  const nodesCopy = sampled.nodes.map(n => ({...n}));
  const edgesCopy = sampled.edges.map(e => ({source: e.src || e.source, target: e.dst || e.target, weight: e.weight}));
  _annotateGraphNodeDegrees(nodesCopy, edgesCopy);
  const hoverIndex = _buildGraphHoverIndex(nodesCopy, edgesCopy);
  
  graphSimulation = d3.forceSimulation(nodesCopy)
    .force('link', d3.forceLink(edgesCopy).id(d => d.id).distance(80))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => _graphNodeRadius(d, 'main') + 12));
  
  // Apply layout positions
  if (currentLayout === 'circle') {
    const angleStep = (2 * Math.PI) / nodesCopy.length;
    nodesCopy.forEach((n, i) => {
      n.x = width / 2 + (width / 3) * Math.cos(i * angleStep - Math.PI / 2);
      n.y = height / 2 + (height / 3) * Math.sin(i * angleStep - Math.PI / 2);
    });
    graphSimulation.stop();
  }
  
  // Draw edges
  const link = graphSvg.append('g')
    .selectAll('line')
    .data(edgesCopy)
    .join('line')
    .attr('class', 'graph-link')
    .attr('stroke', '#cbd5e1')
    .attr('stroke-width', 1.5)
    .attr('marker-end', graphData.directed ? 'url(#arrowhead)' : null);
  
  // Draw nodes
  const node = graphSvg.append('g')
    .selectAll('g')
    .data(nodesCopy)
    .join('g')
    .attr('class', 'graph-node')
    .call(d3.drag()
      .on('start', dragstarted)
      .on('drag', dragged)
      .on('end', dragended));
  
  node.append('circle')
    .attr('r', d => _graphNodeRadius(d, 'main'))
    .attr('fill', d => {
      if (showCommunity && graphData.community?.node_community) {
        const cid = graphData.community.node_community[d.id] || 0;
        return colorScale(cid);
      }
      return '#3b82f6';
    })
    .attr('stroke', '#fff')
    .attr('stroke-width', 2);
  
  node.append('text')
    .attr('dy', d => _graphNodeLabelDy(d, 'main'))
    .attr('text-anchor', 'middle')
    .text(d => d.label || d.id);

  _bindGraphHoverElements(hoverIndex, node, link);
  
  node
    .on('mouseenter', (event, d) => {
      _applyNeighborHover(hoverIndex, d.id, container);
    })
    .on('mouseleave', () => {
      _clearNeighborHover(hoverIndex, container);
    });

  // Click handler for node info + node card
  node.on('click', (event, d) => {
    event.stopPropagation();
    const neighbors = edgesCopy
      .filter(e => e.source.id === d.id || e.target.id === d.id)
      .map(e => e.source.id === d.id ? e.target.id : e.source.id);
    
    document.getElementById('node-info').innerHTML = `
      <strong>节点:</strong> ${d.label || d.id} &nbsp;|&nbsp;
      <strong>入度:</strong> ${d.in_degree || 0} &nbsp;|&nbsp;
      <strong>出度:</strong> ${d.out_degree || 0} &nbsp;|&nbsp;
      <strong>总度:</strong> ${d._visualDegree || d.total_degree || 0} &nbsp;|&nbsp;
      <strong>邻居:</strong> [${neighbors.slice(0, 10).join(', ')}${neighbors.length > 10 ? '...' : ''}]
    `;

    // Show floating node card
    showNodeCard({
      id: d.id, label: d.label || d.id,
      in_degree: d.in_degree || 0, out_degree: d.out_degree || 0,
      neighbors, attrs: d.attrs || null,
    }, event.clientX, event.clientY);
  });
  
  // Zoom behavior
  graphSvg.call(d3.zoom()
    .extent([[0, 0], [width, height]])
    .scaleExtent([0.1, 4])
    .on('zoom', (event) => {
      graphSvg.select('g').attr('transform', event.transform);
    }));
  
  // Simulation tick
  graphSimulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
  
  function dragstarted(event) {
    if (!event.active) graphSimulation.alphaTarget(0.3).restart();
    event.subject.fx = event.subject.x;
    event.subject.fy = event.subject.y;
  }
  
  function dragged(event) {
    event.subject.fx = event.x;
    event.subject.fy = event.y;
  }
  
  function dragended(event) {
    if (!event.active) graphSimulation.alphaTarget(0);
    event.subject.fx = null;
    event.subject.fy = null;
  }
}

// ── Highlight functions ─────────────────────────────────────────────

let activeHighlights = {};  // { id: true }

function renderHighlightButtons() {
  const container = document.getElementById('graph-hl-btns');
  if (!container || !graphData || !graphData.highlights || !graphData.highlights.length) {
    if (container) container.style.display = 'none';
    return;
  }
  container.style.display = 'flex';
  const typeIcons = { node: '◉', path: '⟶', subgraph: '◭', community: '◎' };
  const typeLabels = { node: '节点', path: '路径', subgraph: '子图', community: '社区' };
  let html = '<span style="font-size:11px;color:#64748b;font-weight:600;margin-right:4px;">高亮:</span>';
  for (const hl of graphData.highlights) {
    const icon = typeIcons[hl.type] || '●';
    const typeLabel = typeLabels[hl.type] || hl.type;
    const active = activeHighlights[hl.id] ? 'active' : '';
    html += `<button class="graph-hl-btn hl-${hl.type} ${active}" onclick="toggleHighlight('${hl.id}')">${icon} ${esc(hl.label || typeLabel)}</button>`;
  }
  html += '<button class="graph-hl-clear" onclick="clearAllHighlights()">✖ 清除</button>';
  container.innerHTML = html;
}

function toggleHighlight(id) {
  activeHighlights[id] = !activeHighlights[id];
  applyHighlights();
  renderHighlightButtons();
}

function applyHighlights() {
  if (!graphData || !graphData.highlights) return;
  // Build sets of highlighted node/edge IDs per type
  const hlNodes = {};  // nodeId → Set of hl types
  const hlEdges = {};  // "src→tgt" → Set of hl types
  for (const hl of graphData.highlights) {
    if (!activeHighlights[hl.id]) continue;
    const type = hl.type || 'node';
    if (hl.nodes) {
      for (const nid of hl.nodes) {
        if (!hlNodes[nid]) hlNodes[nid] = new Set();
        hlNodes[nid].add(type);
      }
    }
    if (hl.edges) {
      for (const e of hl.edges) {
        const key = `${e.source || e.src}→${e.target || e.dst}`;
        if (!hlEdges[key]) hlEdges[key] = new Set();
        hlEdges[key].add(type);
      }
    }
    // For path type, also highlight edges between consecutive nodes
    if (type === 'path' && hl.nodes && hl.nodes.length > 1) {
      for (let i = 0; i < hl.nodes.length - 1; i++) {
        const key = `${hl.nodes[i]}→${hl.nodes[i+1]}`;
        const keyRev = `${hl.nodes[i+1]}→${hl.nodes[i]}`;
        if (!hlEdges[key]) hlEdges[key] = new Set();
        hlEdges[key].add(type);
        if (!hlEdges[keyRev]) hlEdges[keyRev] = new Set();
        hlEdges[keyRev].add(type);
      }
    }
  }
  // Apply CSS classes to SVG elements
  const svg = d3.select('#graph-svg');
  // Clear all highlight classes first
  svg.selectAll('.graph-node').classed('hl-path hl-node hl-subgraph hl-community highlighted', false);
  svg.selectAll('.graph-link').classed('hl-path hl-subgraph hl-community highlighted', false);
  // Apply highlights
  svg.selectAll('.graph-node').each(function(d) {
    const types = hlNodes[d.id];
    if (types && types.size > 0) {
      const el = d3.select(this);
      for (const t of types) {
        el.classed(`hl-${t}`, true);
      }
    }
  });
  svg.selectAll('.graph-link').each(function(d) {
    const key = `${d.source.id || d.source}→${d.target.id || d.target}`;
    const types = hlEdges[key];
    if (types && types.size > 0) {
      const el = d3.select(this);
      for (const t of types) {
        el.classed(`hl-${t}`, true);
      }
    }
  });
}

function clearAllHighlights() {
  activeHighlights = {};
  applyHighlights();
  renderHighlightButtons();
}


// ── 侧边栏多图 Tab 管理 ──────────────────────────────────────────────

// 收集 state.messages 里的所有图，按顺序返回
function _allSidebarGraphs() {
  const all = [];
  for (const m of state.messages) {
    if (m.graphs && m.graphs.length) {
      for (const g of m.graphs) all.push(g);
    }
  }
  return all;
}

// 生成 tab 标签 HTML
function _sidebarTabsHtml() {
  const all = _allSidebarGraphs();
  if (!all.length) return '';
  const activeIdx = state.graphSidebarTabIndex >= 0 && state.graphSidebarTabIndex < all.length
    ? state.graphSidebarTabIndex : all.length - 1;
  return all.map((g, i) => {
    const label = _sidebarTabLabel(g, i);
    const cls = i === activeIdx ? 'graph-sidebar-tab active' : 'graph-sidebar-tab';
    return `<button class="${cls}" onclick="switchSidebarTab(${i})" title="${esc(label)}">${esc(label)}</button>`;
  }).join('');
}

// 给一张图生成简短 tab 标签
function _sidebarTabLabel(g, i) {
  if (g.highlights && g.highlights.length) {
    // 用第一个 highlight 的 label
    const first = g.highlights[0];
    return first.label || (first.type === 'path' ? '路径' : first.type === 'node' ? '节点' : '子图');
  }
  return `图 ${i + 1}`;
}

// 切换到第 idx 张图（-1 = 最新）
function switchSidebarTab(idx) {
  const all = _allSidebarGraphs();
  if (!all.length) return;
  const realIdx = (idx < 0 || idx >= all.length) ? all.length - 1 : idx;
  state.graphSidebarTabIndex = realIdx;
  const graphInfo = all[realIdx];
  // 停掉旧的 sidebar simulation
  if (state.graphSidebarGraphInfo) {
    const prev = _inlineGraphSimulations.get(state.graphSidebarGraphInfo.id);
    if (prev) { prev.stop(); _inlineGraphSimulations.delete(state.graphSidebarGraphInfo.id); }
  }
  const sbInfo = { ...graphInfo, id: graphInfo.id + '-sb' };
  state.graphSidebarGraphInfo = sbInfo;
  state.graphSidebarContent = buildInlineGraphCardHtml(sbInfo);
  const b = document.getElementById('graph-sidebar-body');
  if (b) b.innerHTML = state.graphSidebarContent;
  // patch tabs 高亮
  patchSidebarTabs();
  requestAnimationFrame(() => requestAnimationFrame(() => renderInlineGraph(sbInfo)));
}

// 只更新 tab 栏，不重绘图区
function patchSidebarTabs() {
  const el = document.getElementById('graph-sidebar-tabs');
  if (el) el.innerHTML = _sidebarTabsHtml();
}

// 侧边栏已打开时，新图推入后追加 tab 并切过去
function onNewSidebarGraph() {
  if (!state.graphSidebarOpen) return;
  const all = _allSidebarGraphs();
  state.graphSidebarTabIndex = all.length - 1;
  switchSidebarTab(state.graphSidebarTabIndex);
}

// Toggle graph sidebar - 点击直接展开全图
async function toggleGraphSidebar() {
  if (!state.hasGraph || !state.sessionId) return;

  // Toggle sidebar open/close
  if (state.graphSidebarOpen) {
    state.graphSidebarOpen = false;
    document.querySelector('.body-layout')?.classList.remove('has-graph-sidebar');
    const sidebar = document.getElementById('graph-sidebar');
    const toggleBtn = document.getElementById('graph-sidebar-toggle');
    if (sidebar) sidebar.classList.add('hidden');
    if (toggleBtn) toggleBtn.classList.remove('active');
    syncLayoutVars();
    return;
  }

  state.graphSidebarOpen = true;
  document.querySelector('.body-layout')?.classList.add('has-graph-sidebar');
  syncLayoutVars();
  initResizableLayout();
  const sidebar = document.getElementById('graph-sidebar');
  const toggleBtn = document.getElementById('graph-sidebar-toggle');
  const body = document.getElementById('graph-sidebar-body');
  if (sidebar) sidebar.classList.remove('hidden');
  if (toggleBtn) toggleBtn.classList.add('active');

  const all = _allSidebarGraphs();
  if (all.length > 0) {
    // 有缓存的图，直接切到最新一张
    switchSidebarTab(all.length - 1);
  } else {
    // messages 里没有图，fetch 一张全图（无 highlights）
    if (body) body.innerHTML = '<div class="graph-sidebar-empty">加载中…</div>';
    try {
      const res = await apiFetch(`${API_BASE}/api/sessions/${state.sessionId}/graph/visualize`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ include_community: true }),
      });
      const data = await res.json();
      if (data.success && data.nodes) {
        const gid = 'ig-sidebar-fetch-' + Date.now();
        const graphInfo = {
          id: gid,
          nodes: data.nodes,
          edges: (data.edges || data.links || []).map(e => ({
            src: e.src || e.source, dst: e.dst || e.target,
            source: e.src || e.source, target: e.dst || e.target,
            weight: e.weight,
          })),
          directed: data.directed,
          num_nodes: data.num_nodes,
          num_edges: data.num_edges,
          highlights: data.highlights,
          communities: data.communities || data.community,
          activeHighlights: {},
        };
        // 把 fetch 来的图临时存到最后一条消息的 graphs 里，让 tab 系统能管理它
        const lastMsg = state.messages[state.messages.length - 1];
        if (lastMsg) {
          if (!lastMsg.graphs) lastMsg.graphs = [];
          lastMsg.graphs.push(graphInfo);
        }
        switchSidebarTab(_allSidebarGraphs().length - 1);
      } else {
        if (body) body.innerHTML = '<div class="graph-sidebar-empty">获取图数据失败</div>';
      }
    } catch (e) {
      if (body) body.innerHTML = `<div class="graph-sidebar-empty">加载失败: ${esc(String(e.message || e))}</div>`;
    }
  }
}

// Sync graph sidebar content from current messages

// ── Inline Graph Card (in chat messages) ────────────────────────────
// Global registry of inline graph simulations for cleanup
const _inlineGraphSimulations = new Map();

// ── Large-graph sampling helper ──────────────────────────────────────
// Returns { nodes, edges, truncated, renderedCount } after applying Top-N sampling.
// Strategy: keep nodes with highest degree; keep only edges whose both endpoints survive.
const _GRAPH_RENDER_LIMIT = 200; // max nodes rendered at once

function _sampleGraphForRender(allNodes, allEdges, limit) {
  if (allNodes.length <= limit) {
    return { nodes: allNodes, edges: allEdges, truncated: false, renderedCount: allNodes.length };
  }
  // Build degree map from edges
  const degree = {};
  const visibleDegree = {};
  allNodes.forEach(n => {
    const id = n.id || n.label;
    const total = Number(n.total_degree);
    const inDegree = Number(n.in_degree);
    const outDegree = Number(n.out_degree);
    visibleDegree[id] = 0;
    degree[id] = Number.isFinite(total)
      ? total
      : (Number.isFinite(inDegree) ? inDegree : 0) + (Number.isFinite(outDegree) ? outDegree : 0);
  });
  allEdges.forEach(e => {
    const s = e.src || e.source, t = e.dst || e.target;
    visibleDegree[s] = (visibleDegree[s] || 0) + 1;
    visibleDegree[t] = (visibleDegree[t] || 0) + 1;
  });
  Object.keys(visibleDegree).forEach(id => {
    degree[id] = Math.max(degree[id] || 0, visibleDegree[id] || 0);
  });
  // Sort descending by degree, keep top-limit
  const sorted = [...allNodes].sort((a, b) => {
    const ia = a.id || a.label, ib = b.id || b.label;
    return (degree[ib] || 0) - (degree[ia] || 0);
  });
  const kept = sorted.slice(0, limit);
  const keptSet = new Set(kept.map(n => n.id || n.label));
  const keptEdges = allEdges.filter(e => {
    const s = e.src || e.source, t = e.dst || e.target;
    return keptSet.has(s) && keptSet.has(t);
  });
  return { nodes: kept, edges: keptEdges, truncated: true, renderedCount: kept.length };
}

function _graphEndpointId(endpoint) {
  if (endpoint == null) return '';
  if (typeof endpoint === 'object') return String(endpoint.id || endpoint.label || endpoint.name || '');
  return String(endpoint);
}

function _annotateGraphNodeDegrees(nodes, edges) {
  const visibleDegree = {};
  nodes.forEach(n => {
    visibleDegree[_graphEndpointId(n.id || n.label)] = 0;
  });
  edges.forEach(e => {
    const s = _graphEndpointId(e.src || e.source);
    const t = _graphEndpointId(e.dst || e.target);
    if (s) visibleDegree[s] = (visibleDegree[s] || 0) + 1;
    if (t) visibleDegree[t] = (visibleDegree[t] || 0) + 1;
  });
  nodes.forEach(n => {
    const id = _graphEndpointId(n.id || n.label);
    const total = Number(n.total_degree);
    const inDegree = Number(n.in_degree);
    const outDegree = Number(n.out_degree);
    const explicitDegree = Number.isFinite(total) ? total : 0;
    const directedDegree = (Number.isFinite(inDegree) ? inDegree : 0) + (Number.isFinite(outDegree) ? outDegree : 0);
    n._visibleDegree = visibleDegree[id] || 0;
    n._visualDegree = Math.max(explicitDegree, directedDegree, n._visibleDegree);
  });
}

function _graphNodeRadius(d, mode = 'inline') {
  const degree = Math.max(0, Number(d?._visualDegree ?? d?.total_degree ?? d?.totalDegree ?? 0) || 0);
  const base = Math.max(8, Math.min(Math.sqrt(degree + 1) * 3, 30));
  if (mode === 'expanded') return Math.max(10, Math.min(base * 1.14, 36));
  if (mode === 'main') return Math.max(9, Math.min(base * 1.05, 33));
  return Math.max(8, Math.min(base * 0.94, 28));
}

function _graphNodeLabelDy(d, mode = 'inline') {
  return _graphNodeRadius(d, mode) + (mode === 'expanded' ? 12 : mode === 'main' ? 11 : 9);
}

function _setGraphHoverSurface(surfaceEl, active) {
  if (surfaceEl && surfaceEl.classList) {
    surfaceEl.classList.toggle('is-neighbor-hover', !!active);
  }
}

function _buildGraphHoverIndex(nodes, edges) {
  const index = {
    adjacency: new Map(),
    nodeEls: new Map(),
    linkEls: new Map(),
    activeNodeEls: [],
    activeLinkEls: [],
  };
  const ensure = id => {
    if (!index.adjacency.has(id)) {
      index.adjacency.set(id, { nodeIds: new Set([id]), edgeIds: new Set() });
    }
    return index.adjacency.get(id);
  };
  nodes.forEach(node => ensure(_graphEndpointId(node?.id ?? node?.label)));
  edges.forEach((edge, i) => {
    const source = _graphEndpointId(edge?.source ?? edge?.src);
    const target = _graphEndpointId(edge?.target ?? edge?.dst);
    const edgeId = `${source}->${target}#${i}`;
    edge._hoverEdgeId = edgeId;
    if (source) {
      const sourceInfo = ensure(source);
      sourceInfo.nodeIds.add(target);
      sourceInfo.edgeIds.add(edgeId);
    }
    if (target) {
      const targetInfo = ensure(target);
      targetInfo.nodeIds.add(source);
      targetInfo.edgeIds.add(edgeId);
    }
  });
  return index;
}

function _bindGraphHoverElements(index, nodeSel, linkSel) {
  nodeSel.each(function(d) {
    index.nodeEls.set(_graphEndpointId(d?.id ?? d?.label), this);
  });
  linkSel.each(function(d) {
    if (d?._hoverEdgeId) index.linkEls.set(d._hoverEdgeId, this);
  });
}

function _setElementClass(elements, cls, active) {
  elements.forEach(el => {
    if (el && el.classList) el.classList.toggle(cls, !!active);
  });
}

function _applyNeighborHover(index, focusId, surfaceEl = null) {
  _clearNeighborHover(index, null);
  const info = index.adjacency.get(_graphEndpointId(focusId));
  if (!info) return;
  _setGraphHoverSurface(surfaceEl, true);
  index.activeNodeEls = [...info.nodeIds].map(id => index.nodeEls.get(id)).filter(Boolean);
  index.activeLinkEls = [...info.edgeIds].map(id => index.linkEls.get(id)).filter(Boolean);
  _setElementClass(index.activeNodeEls, 'highlighted', true);
  _setElementClass(index.activeLinkEls, 'highlighted', true);
}

function _clearNeighborHover(index, surfaceEl = null) {
  _setGraphHoverSurface(surfaceEl, false);
  _setElementClass(index.activeNodeEls || [], 'highlighted', false);
  _setElementClass(index.activeLinkEls || [], 'highlighted', false);
  index.activeNodeEls = [];
  index.activeLinkEls = [];
}

function buildInlineGraphCardHtml(graphInfo) {
  if (!graphInfo || !graphInfo.nodes || !graphInfo.edges) return '';
  const gid = graphInfo.id;
  const totalNodes = graphInfo.num_nodes || graphInfo.nodes.length;
  const totalEdges = graphInfo.num_edges || graphInfo.edges.length;
  const directed = graphInfo.directed;
  const isTruncated = graphInfo._truncated;
  const renderedCount = graphInfo._renderedCount || totalNodes;

  // Truncation notice
  let truncationHtml = '';
  if (isTruncated) {
    truncationHtml = `<div style="padding:5px 12px 0;font-size:0.68rem;color:#f59e0b;font-family:var(--mono);">
      ⚠ 图共 ${totalNodes} 节点，当前仅展示度数最高的 ${renderedCount} 个节点。
      可向 Agent 提问：<em>"展示节点 X 的邻居子图"</em> 或 <em>"提取社区 N 的子图"</em> 来查看局部结构。
    </div>`;
  }

  // Build highlight buttons with per-highlight color support
  let hlBtnsHtml = '';
  if (graphInfo.highlights && graphInfo.highlights.length) {
    const typeIcons = { node: '◉', path: '⟶', subgraph: '◭', community: '◎' };
    for (const hl of graphInfo.highlights) {
      const icon = typeIcons[hl.type] || '●';
      const hlColor = hl.color || '';
      // Store color as data attribute and CSS variable for dynamic styling
      const colorAttr = hlColor ? `data-hl-color="${esc(hlColor)}" style="--hl-color:${esc(hlColor)}"` : '';
      const cls = `graph-hl-btn hl-${hl.type}`;
      hlBtnsHtml += `<button class="${cls}" data-graph-id="${esc(gid)}" data-hl-id="${esc(hl.id)}" ${colorAttr} onclick="toggleInlineHighlight('${esc(gid)}','${esc(hl.id)}')">${icon} ${esc(hl.label || hl.type)}</button>`;
    }
    hlBtnsHtml += `<button class="graph-hl-clear" onclick="clearInlineHighlights('${esc(gid)}')">✖</button>`;
  }
  const headerLabel = isTruncated
    ? `图概览 · 共 ${totalNodes} 节点 / ${totalEdges} 边 · 展示 ${renderedCount} 节点${directed ? ' · 有向' : ''}`
    : `图可视化 · ${totalNodes} 节点 · ${totalEdges} 边${directed ? ' · 有向' : ''}`;
  return `<div class="inline-graph-card" data-graph-id="${esc(gid)}">
    <div class="inline-graph-header">
      <span>📊 ${headerLabel}</span>
      <div class="inline-graph-controls">
        <button class="ig-ctrl-btn active" data-graph-id="${esc(gid)}" data-layout="force" onclick="setInlineLayout('${esc(gid)}','force')">力导向</button>
        <button class="ig-ctrl-btn" data-graph-id="${esc(gid)}" data-layout="circle" onclick="setInlineLayout('${esc(gid)}','circle')">环形</button>
        <button class="ig-ctrl-btn" onclick="resetInlineGraphView('${esc(gid)}')">重置</button>
      </div>
    </div>
    ${truncationHtml}
    ${hlBtnsHtml ? `<div class="inline-graph-footer">${hlBtnsHtml}</div>` : ''}
    <div class="inline-graph-body" id="ig-body-${esc(gid)}">
      <svg id="ig-svg-${esc(gid)}"></svg>
    </div>
    <div class="inline-graph-node-info" id="ig-info-${esc(gid)}">点击节点查看详情</div>
  </div>`;
}

function renderInlineGraph(graphInfo) {
  if (!graphInfo || !graphInfo.nodes || !graphInfo.edges) return;
  const gid = graphInfo.id;
  const svgId = `#ig-svg-${CSS.escape(gid)}`;
  const bodyId = `ig-body-${gid}`;
  const container = document.getElementById(bodyId);
  if (!container) return;
  const width = container.clientWidth || container.offsetWidth || 600;
  const height = container.clientHeight || container.offsetHeight
    || container.parentElement?.clientHeight
    || 500;

  // Stop previous simulation if any
  const prevSim = _inlineGraphSimulations.get(gid);
  if (prevSim) { prevSim.stop(); _inlineGraphSimulations.delete(gid); }

  // ── Large-graph sampling ──────────────────────────────────────────
  const allNodes = graphInfo.nodes.map(n => ({...n, id: n.id || n.label}));
  const allEdges = graphInfo.edges.map(e => ({src: e.src || e.source, dst: e.dst || e.target, source: e.src || e.source, target: e.dst || e.target, weight: e.weight}));
  const sampled = _sampleGraphForRender(allNodes, allEdges, _GRAPH_RENDER_LIMIT);
  // Write truncation state back so the card header can reflect it on re-render
  graphInfo._truncated = sampled.truncated;
  graphInfo._renderedCount = sampled.renderedCount;
  // Refresh truncation notice in the DOM without full re-render
  const noticeEl = container.closest('.inline-graph-card')?.querySelector('[data-truncation-notice]');
  if (noticeEl) {
    noticeEl.style.display = sampled.truncated ? '' : 'none';
  }
  // ─────────────────────────────────────────────────────────────────

  d3.select(svgId).selectAll('*').remove();
  const svg = d3.select(svgId).attr('width', width).attr('height', height);

  // Arrow marker
  const defs = svg.append('defs');
  defs.append('marker')
    .attr('id', `arrow-${gid}`)
    .attr('viewBox', '0 -5 10 10').attr('refX', 20).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', '#94a3b8');

  const nodesCopy = sampled.nodes.map(n => ({...n}));
  const edgesCopy = sampled.edges.map(e => ({source: e.src || e.source, target: e.dst || e.target, weight: e.weight}));
  _annotateGraphNodeDegrees(nodesCopy, edgesCopy);
  const hoverIndex = _buildGraphHoverIndex(nodesCopy, edgesCopy);

  const colorScale = d3.scaleOrdinal(d3.schemeCategory10);
  const layout = graphInfo._layout || 'force';

  const sim = d3.forceSimulation(nodesCopy)
    .force('link', d3.forceLink(edgesCopy).id(d => d.id).distance(80))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collision', d3.forceCollide().radius(d => _graphNodeRadius(d, 'inline') + 10));

  if (layout === 'circle') {
    const step = (2*Math.PI)/nodesCopy.length;
    nodesCopy.forEach((n,i) => { n.x = width/2+(width/3)*Math.cos(i*step-Math.PI/2); n.y = height/2+(height/3)*Math.sin(i*step-Math.PI/2); });
    sim.stop();
  }

  const g = svg.append('g');
  const link = g.selectAll('line').data(edgesCopy).join('line').attr('class','graph-link').attr('stroke','#cbd5e1').attr('stroke-width',1.5).attr('marker-end',graphInfo.directed?`url(#arrow-${gid})`:null);
  const node = g.selectAll('g').data(nodesCopy).join('g').attr('class','graph-node').call(d3.drag().on('start',e=>{if(!e.active)sim.alphaTarget(0.3).restart();e.subject.fx=e.subject.x;e.subject.fy=e.subject.y;}).on('drag',e=>{e.subject.fx=e.x;e.subject.fy=e.y;}).on('end',e=>{if(!e.active)sim.alphaTarget(0);e.subject.fx=null;e.subject.fy=null;}));

  node.append('circle').attr('r',d=>_graphNodeRadius(d,'inline')).attr('fill',d=>{
    if(graphInfo.communities?.node_community){const cid=graphInfo.communities.node_community[d.id]||0;return colorScale(cid);}
    return '#3b82f6';
  }).attr('stroke','#fff').attr('stroke-width',1.5);

  node.append('text').attr('dy',d=>_graphNodeLabelDy(d,'inline')).attr('text-anchor','middle').attr('font-size','10px').attr('fill','var(--text2)').text(d=>d.label||d.id);

  _bindGraphHoverElements(hoverIndex, node, link);

  node
    .on('mouseenter',(ev,d)=>{
      _applyNeighborHover(hoverIndex, d.id, container);
    })
    .on('mouseleave',()=>{
      _clearNeighborHover(hoverIndex, container);
    });

  node.on('click',(ev,d)=>{
    ev.stopPropagation();
    const nb=edgesCopy.filter(e=>e.source.id===d.id||e.target.id===d.id).map(e=>e.source.id===d.id?e.target.id:e.source.id);
    const info=document.getElementById(`ig-info-${gid}`);
    if(info)info.innerHTML=`<strong>${d.label||d.id}</strong> · 入度:${d.in_degree||0} · 出度:${d.out_degree||0} · 邻居:[${nb.slice(0,8).join(',')}${nb.length>8?'...':''}]`;
    // 收集带权重的邻居边信息
    const nbEdges=edgesCopy.filter(e=>e.source.id===d.id||e.target.id===d.id)
      .map(e=>({neighbor:e.source.id===d.id?e.target.id:e.source.id, weight:e.weight, dir:e.source.id===d.id?'out':'in'}));
    // Show floating node card
    showNodeCard({
      id: d.id, label: d.label || d.id,
      in_degree: d.in_degree || 0, out_degree: d.out_degree || 0,
      neighbors: nb, attrs: d.attrs || null, nbEdges,
    }, ev.clientX, ev.clientY);
  });
  
  // 点击空白处重置信息区
  svg.on('click',()=>{
    _clearNeighborHover(hoverIndex, container);
    const info=document.getElementById(`ig-info-${gid}`);
    if(info)info.innerHTML='点击节点查看详情';
  });
  
  // 双击打开侧边栏全图
  container.addEventListener('dblclick', () => {
    openGraphSidebarFull(gid);
  });

  svg.call(d3.zoom().extent([[0,0],[width,height]]).scaleExtent([0.1,4]).on('zoom',ev=>g.attr('transform',ev.transform)));

  sim.on('tick',()=>{link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`);});
  _inlineGraphSimulations.set(gid, sim);

  // Apply existing highlights
  applyInlineHighlights(gid);
}

function setInlineLayout(gid, layout) {
  // Find graphInfo in messages
  for (const m of state.messages) {
    if (!m.graphs) continue;
    for (const g of m.graphs) {
      if (g.id === gid) { g._layout = layout; renderInlineGraph(g); break; }
    }
  }
  // Update button states
  document.querySelectorAll(`.ig-ctrl-btn[data-graph-id="${gid}"]`).forEach(btn => {
    btn.classList.toggle('active', btn.dataset.layout === layout);
  });
}

function resetInlineGraphView(gid) {
  const svg = d3.select(`#ig-svg-${CSS.escape(gid)}`);
  if (svg.node()) svg.transition().duration(750).call(d3.zoom().transform, d3.zoomIdentity);
}

// 从边对象或数组 [u,v] 提取 "u→v" key
function _edgeKey(e) {
  if (Array.isArray(e)) return `${e[0]}→${e[1]}`;
  return `${e.source||e.src}→${e.target||e.dst}`;
}

// 统一查找 graphInfo：先查 messages，再查 sidebar
function _findGraphInfo(gid) {
  for (const m of state.messages) {
    if (!m.graphs) continue;
    for (const g of m.graphs) { if (g.id === gid) return g; }
  }
  if (state.graphSidebarGraphInfo && state.graphSidebarGraphInfo.id === gid) return state.graphSidebarGraphInfo;
  return null;
}

function toggleInlineHighlight(gid, hlId) {
  const g = _findGraphInfo(gid);
  if (!g) return;
  if (!g.activeHighlights) g.activeHighlights = {};
  g.activeHighlights[hlId] = !g.activeHighlights[hlId];
  applyInlineHighlights(gid);
  document.querySelectorAll(`.graph-hl-btn[data-graph-id="${gid}"][data-hl-id="${hlId}"]`).forEach(btn => btn.classList.toggle('active', !!g.activeHighlights[hlId]));
}

function applyInlineHighlights(gid) {
  const graphInfo = _findGraphInfo(gid);
  if (!graphInfo || !graphInfo.highlights) return;
  const svg = d3.select(`#ig-svg-${CSS.escape(gid)}`);
  // Build highlight sets — now track both type and color per highlight
  const hlNodes={}, hlEdges={};
  for (const hl of graphInfo.highlights) {
    if (!graphInfo.activeHighlights?.[hl.id]) continue;
    const type=hl.type||'node';
    const color=hl.color||'';
    if(hl.nodes) for(const nid of hl.nodes){
      if(!hlNodes[nid])hlNodes[nid]={types:new Set(),color:''};
      hlNodes[nid].types.add(type);
      if(color)hlNodes[nid].color=color;
    }
    if(hl.edges) for(const e of hl.edges){
      const k=_edgeKey(e);
      if(!hlEdges[k])hlEdges[k]={types:new Set(),color:''};
      hlEdges[k].types.add(type);
      if(color)hlEdges[k].color=color;
      // 同时加反向 key，兼容无向图高亮
      const kr=Array.isArray(e)?`${e[1]}→${e[0]}`:`${e.target||e.dst}→${e.source||e.src}`;
      if(!hlEdges[kr])hlEdges[kr]={types:new Set(),color:''};
      hlEdges[kr].types.add(type);
      if(color)hlEdges[kr].color=color;
    }
    if(type==='path'&&hl.nodes&&hl.nodes.length>1) for(let i=0;i<hl.nodes.length-1;i++){
      const k=`${hl.nodes[i]}→${hl.nodes[i+1]}`;
      const kr=`${hl.nodes[i+1]}→${hl.nodes[i]}`;
      if(!hlEdges[k])hlEdges[k]={types:new Set(),color:''};
      hlEdges[k].types.add(type);
      if(color)hlEdges[k].color=color;
      if(!hlEdges[kr])hlEdges[kr]={types:new Set(),color:''};
      hlEdges[kr].types.add(type);
      if(color)hlEdges[kr].color=color;
    }
  }
  svg.selectAll('.graph-node').classed('hl-path hl-node hl-subgraph hl-community highlighted',false)
    .attr('data-hl-color',null).style('--hl-color',null);
  svg.selectAll('.graph-link').classed('hl-path hl-subgraph hl-community highlighted',false)
    .attr('data-hl-color',null).style('--hl-color',null);
  svg.selectAll('.graph-node').each(function(d){
    const info=hlNodes[d.id];
    if(info&&info.types.size){
      const el=d3.select(this);
      for(const tp of info.types)el.classed(`hl-${tp}`,true);
      if(info.color){el.attr('data-hl-color',info.color).style('--hl-color',info.color);}
    }
  });
  svg.selectAll('.graph-link').each(function(d){
    const k=`${d.source.id||d.source}→${d.target.id||d.target}`;
    const info=hlEdges[k];
    if(info&&info.types.size){
      const el=d3.select(this);
      for(const tp of info.types)el.classed(`hl-${tp}`,true);
      if(info.color){el.attr('data-hl-color',info.color).style('--hl-color',info.color);}
    }
  });
}

// 双击打开侧边栏全图
function openGraphSidebarFull(gid) {
  // 找到该图在 _allSidebarGraphs() 中的下标，切换到对应 tab
  const all = _allSidebarGraphs();
  const idx = all.findIndex(g => g.id === gid);
  state.graphSidebarOpen = true;
  document.querySelector('.body-layout')?.classList.add('has-graph-sidebar');
  syncLayoutVars();
  initResizableLayout();
  const sidebar = document.getElementById('graph-sidebar');
  const toggleBtn = document.getElementById('graph-sidebar-toggle');
  if (sidebar) sidebar.classList.remove('hidden');
  if (toggleBtn) toggleBtn.classList.add('active');
  switchSidebarTab(idx >= 0 ? idx : all.length - 1);
}

// 图展开到侧边栏
function expandInlineGraph(gid) {
  // Find graphInfo
  let graphInfo = null;
  for (const m of state.messages) {
    if (!m.graphs) continue;
    for (const g of m.graphs) {
      if (g.id === gid) { graphInfo = g; break; }
    }
    if (graphInfo) break;
  }
  if (!graphInfo) return;
  
  // Close existing panel first
  closeExpandModal();
  
  // Create right sidebar panel
  const panel = document.createElement('div');
  panel.id = 'expand-panel';
  panel.style.cssText = 'position:fixed;right:0;top:0;bottom:0;width:50%;min-width:500px;max-width:900px;background:var(--bg1);border-left:1px solid var(--border);z-index:9999;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,0.15)';
  
  const header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0';
  header.innerHTML = `<span style="font-weight:600;color:var(--text)">📊 全图 · ${graphInfo.num_nodes || graphInfo.nodes.length} 节点 · ${graphInfo.num_edges || graphInfo.edges.length} 边${graphInfo.directed ? ' · 有向' : ''}</span><button id="expand-close" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px">×</button>`;
  
  const controls = document.createElement('div');
  controls.style.cssText = 'display:flex;gap:6px;padding:8px 12px;background:var(--bg1);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;align-items:center';
  controls.innerHTML = `
    <button class="ig-ctrl-btn active" data-layout="force" onclick="setExpandLayout(this,'force')">力导向</button>
    <button class="ig-ctrl-btn" data-layout="circle" onclick="setExpandLayout(this,'circle')">环形</button>
    <span style="width:1px;height:20px;background:var(--border);margin:0 4px"></span>
    <button class="ig-ctrl-btn" onclick="resetExpandView()">重置</button>
    <button class="ig-ctrl-btn" onclick="zoomInExpand()">+</button>
    <button class="ig-ctrl-btn" onclick="zoomOutExpand()">-</button>
  `;
  
  // Highlight buttons
  let hlBtnsHtml = '';
  if (graphInfo.highlights && graphInfo.highlights.length) {
    const typeIcons = { node: '◉', path: '⟶', subgraph: '◭', community: '◎' };
    for (const hl of graphInfo.highlights) {
      const icon = typeIcons[hl.type] || '●';
      const hlColor = hl.color || '';
      const colorAttr = hlColor ? `data-hl-color="${esc(hlColor)}" style="--hl-color:${esc(hlColor)}"` : '';
      const cls = `ig-ctrl-btn hl-${hl.type}${graphInfo.activeHighlights?.[hl.id] ? ' active' : ''}`;
      hlBtnsHtml += `<button class="${cls}" data-hl-id="${esc(hl.id)}" ${colorAttr} onclick="toggleExpandHighlight('${esc(hl.id)}')">${icon} ${esc(hl.label || hl.type)}</button>`;
    }
    hlBtnsHtml += `<button class="ig-ctrl-btn" onclick="clearExpandHighlights()">✖ 清除</button>`;
  }
  
  if (hlBtnsHtml) {
    const hlBar = document.createElement('div');
    hlBar.style.cssText = 'display:flex;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;align-items:center';
    hlBar.innerHTML = hlBtnsHtml;
    panel.appendChild(header);
    panel.appendChild(controls);
    panel.appendChild(hlBar);
  } else {
    panel.appendChild(header);
    panel.appendChild(controls);
  }
  
  const canvas = document.createElement('div');
  canvas.style.cssText = 'flex:1;position:relative;overflow:hidden;background:var(--bg)';
  canvas.id = 'expand-canvas';
  
  panel.appendChild(canvas);
  document.body.appendChild(panel);
  
  // Render graph
  setTimeout(() => {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    const svg = d3.select('#expand-canvas').append('svg').attr('width', w).attr('height', h).style('display','block');
    
    const defs = svg.append('defs');
    defs.append('marker').attr('id','expand-arrow').attr('viewBox','0 -5 10 10').attr('refX',20).attr('refY',0).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','var(--text3)');
    
    const allNodesEx = graphInfo.nodes.map(n => ({...n, id: n.id || n.label}));
    const allEdgesEx = graphInfo.edges.map(e => ({src: e.src||e.source, dst: e.dst||e.target, source: e.src||e.source, target: e.dst||e.target}));
    const sampledEx = _sampleGraphForRender(allNodesEx, allEdgesEx, _GRAPH_RENDER_LIMIT);
    if (sampledEx.truncated) {
      const notice = document.createElement('div');
      notice.style.cssText = 'padding:6px 16px;font-size:0.7rem;color:#f59e0b;background:rgba(245,158,11,0.08);border-bottom:1px solid var(--border);flex-shrink:0;font-family:var(--mono)';
      notice.textContent = `图共 ${graphInfo.nodes.length} 节点，当前展示度数最高的 ${sampledEx.renderedCount} 个节点。可向 Agent 提问查询局部子图。`;
      canvas.before(notice);
    }
    const nodesCopy = sampledEx.nodes.map(n => ({...n}));
    const edgesCopy = sampledEx.edges.map(e => ({source: e.src || e.source, target: e.dst || e.target}));
    _annotateGraphNodeDegrees(nodesCopy, edgesCopy);
    const hoverIndex = _buildGraphHoverIndex(nodesCopy, edgesCopy);
    const colorScale = d3.scaleOrdinal(d3.schemeCategory10);
    
    const g = svg.append('g');
    const link = g.selectAll('line').data(edgesCopy).join('line').attr('class','graph-link').attr('stroke','var(--border2)').attr('stroke-width',1.5).attr('marker-end', graphInfo.directed ? 'url(#expand-arrow)' : null);
    const node = g.selectAll('g').data(nodesCopy).join('g').attr('class','graph-node').style('cursor','pointer').call(d3.drag().on('start',e=>{if(!sim.alphaTarget(0.3).restart())sim.alphaTarget(0.3).restart();e.subject.fx=e.subject.x;e.subject.fy=e.subject.y;}).on('drag',e=>{e.subject.fx=e.x;e.subject.fy=e.y;}).on('end',e=>{if(!e.active)sim.alphaTarget(0);e.subject.fx=null;e.subject.fy=null;}));
    
    node.append('circle').attr('r',d=>_graphNodeRadius(d,'expanded')).attr('fill',d=>{
      if(graphInfo.communities?.node_community){const cid=graphInfo.communities.node_community[d.id]||0;return colorScale(cid);}
      return 'var(--accent)';
    }).attr('stroke','var(--bg1)').attr('stroke-width',2);
    node.append('text').attr('dy',d=>_graphNodeLabelDy(d,'expanded')).attr('text-anchor','middle').attr('font-size','12px').attr('fill','var(--text)').text(d=>d.label||d.id);

    _bindGraphHoverElements(hoverIndex, node, link);
    
    node
      .on('mouseenter',(ev,d)=>{
        _applyNeighborHover(hoverIndex, d.id, canvas);
      })
      .on('mouseleave',()=>{
        _clearNeighborHover(hoverIndex, canvas);
      });

    node.on('click',(ev,d)=>{
      ev.stopPropagation();
      const nb=edgesCopy.filter(e=>e.source.id===d.id||e.target.id===d.id).map(e=>e.source.id===d.id?e.target.id:e.source.id);
      header.innerHTML = `<span style="font-weight:600;color:var(--text)">📊 <strong>${d.label||d.id}</strong> · 入度:${d.in_degree||0} · 出度:${d.out_degree||0} · 度:${d._visualDegree||d.total_degree||0} · 邻居:[${nb.slice(0,12).join(',')}${nb.length>12?'...':''}]</span><button id="expand-close" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px">×</button>`;
      document.getElementById('expand-close').onclick = closeExpandModal;
      // Show floating node card
      showNodeCard({
        id: d.id, label: d.label || d.id,
        in_degree: d.in_degree || 0, out_degree: d.out_degree || 0,
        neighbors: nb, attrs: d.attrs || null,
      }, ev.clientX, ev.clientY);
    });
    
    // 点击空白处重置标题栏
    svg.on('click',()=>{
      _clearNeighborHover(hoverIndex, canvas);
      header.innerHTML = `<span style="font-weight:600;color:var(--text)">📊 全图 · ${graphInfo.num_nodes || graphInfo.nodes.length} 节点 · ${graphInfo.num_edges || graphInfo.edges.length} 边${graphInfo.directed ? ' · 有向' : ''}</span><button id="expand-close" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px">×</button>`;
      document.getElementById('expand-close').onclick = closeExpandModal;
    });
    
    // Zoom
    const zoom = d3.zoom().scaleExtent([0.1,10]).on('zoom',ev=>g.attr('transform',ev.transform));
    svg.call(zoom);
    window._expandZoom = zoom;
    window._expandGid = gid;
    window._expandGraphInfo = graphInfo;
    window._expandNodes = nodesCopy;
    window._expandEdges = edgesCopy;
    
    const sim = d3.forceSimulation(nodesCopy).force('link',d3.forceLink(edgesCopy).id(d=>d.id).distance(120)).force('charge',d3.forceManyBody().strength(-300)).force('center',d3.forceCenter(w/2,h/2)).force('collision',d3.forceCollide().radius(d=>_graphNodeRadius(d,'expanded')+14));
    sim.on('tick',()=>{link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`);});
    window._expandSim = sim;
    window._expandSvg = svg;
    
    // Apply highlights
    if (graphInfo.highlights) {
      applyExpandHighlights();
    }
  }, 50);
  
  document.getElementById('expand-close').onclick = closeExpandModal;
}

function closeExpandModal() {
  const panel = document.getElementById('expand-panel');
  if (panel) panel.remove();
  window._expandSim = null;
  window._expandSvg = null;
  window._expandZoom = null;
  window._expandGid = null;
  window._expandGraphInfo = null;
  window._expandNodes = null;
  window._expandEdges = null;
}

function setExpandLayout(btn, layout) {
  document.querySelectorAll('#expand-panel .ig-ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (!window._expandSvg || !window._expandSim) return;
  const sim = window._expandSim;
  const nodes = sim.nodes();
  if (layout === 'circle') {
    const svg = window._expandSvg;
    const w = parseFloat(svg.attr('width'));
    const h = parseFloat(svg.attr('height'));
    const step = (2*Math.PI)/nodes.length;
    nodes.forEach((n,i) => { n.x = w/2+(w/3)*Math.cos(i*step-Math.PI/2); n.y = h/2+(h/3)*Math.sin(i*step-Math.PI/2); });
    sim.alpha(0.3).restart();
  }
}

function resetExpandView() {
  if (window._expandSvg && window._expandZoom) {
    window._expandSvg.transition().duration(600).call(window._expandZoom.transform, d3.zoomIdentity);
  }
}

function zoomInExpand() {
  if (window._expandSvg && window._expandZoom) {
    window._expandSvg.transition().duration(300).call(window._expandZoom.scaleBy, 1.4);
  }
}

function zoomOutExpand() {
  if (window._expandSvg && window._expandZoom) {
    window._expandSvg.transition().duration(300).call(window._expandZoom.scaleBy, 0.7);
  }
}

function toggleExpandHighlight(hlId) {
  const graphInfo = window._expandGraphInfo;
  if (!graphInfo) return;
  if (!graphInfo.activeHighlights) graphInfo.activeHighlights = {};
  graphInfo.activeHighlights[hlId] = !graphInfo.activeHighlights[hlId];
  
  // Update button state
  const btn = document.querySelector(`#expand-panel button[data-hl-id="${hlId}"]`);
  if (btn) btn.classList.toggle('active', graphInfo.activeHighlights[hlId]);
  
  applyExpandHighlights();
}

function clearExpandHighlights() {
  const graphInfo = window._expandGraphInfo;
  if (!graphInfo) return;
  graphInfo.activeHighlights = {};
  
  // Update buttons
  document.querySelectorAll('#expand-panel .hl-node, #expand-panel .hl-path, #expand-panel .hl-subgraph, #expand-panel .hl-community').forEach(b => b.classList.remove('active'));
  
  applyExpandHighlights();
}

function applyExpandHighlights() {
  const graphInfo = window._expandGraphInfo;
  const svg = window._expandSvg;
  const nodesCopy = window._expandNodes;
  const edgesCopy = window._expandEdges;
  if (!graphInfo || !svg || !nodesCopy) return;
  if (!graphInfo.highlights) return;
  const hlNodes={}, hlEdges={};
  for (const hl of graphInfo.highlights) {
    if (!graphInfo.activeHighlights?.[hl.id]) continue;
    const type=hl.type||'node', color=hl.color||'';
    if(hl.nodes) for(const nid of hl.nodes){
      if(!hlNodes[nid])hlNodes[nid]={types:new Set(),color:''};
      hlNodes[nid].types.add(type);
      if(color)hlNodes[nid].color=color;
    }
    if(hl.edges) for(const e of hl.edges){
      const k=_edgeKey(e);
      if(!hlEdges[k])hlEdges[k]={types:new Set(),color:''};
      hlEdges[k].types.add(type);
      if(color)hlEdges[k].color=color;
      const kr=Array.isArray(e)?`${e[1]}→${e[0]}`:`${e.target||e.dst}→${e.source||e.src}`;
      if(!hlEdges[kr])hlEdges[kr]={types:new Set(),color:''};
      hlEdges[kr].types.add(type);
      if(color)hlEdges[kr].color=color;
    }
    if(type==='path'&&hl.nodes&&hl.nodes.length>1) for(let i=0;i<hl.nodes.length-1;i++){
      const k=`${hl.nodes[i]}→${hl.nodes[i+1]}`;
      const kr=`${hl.nodes[i+1]}→${hl.nodes[i]}`;
      if(!hlEdges[k])hlEdges[k]={types:new Set(),color:''};
      if(!hlEdges[kr])hlEdges[kr]={types:new Set(),color:''};
      hlEdges[k].types.add(type); hlEdges[kr].types.add(type);
      if(color){hlEdges[k].color=color;hlEdges[kr].color=color;}
    }
  }
  svg.selectAll('.graph-node').classed('hl-path hl-node hl-subgraph hl-community highlighted',false).attr('data-hl-color',null).style('--hl-color',null);
  svg.selectAll('.graph-link').classed('hl-path hl-subgraph hl-community highlighted',false).attr('data-hl-color',null).style('--hl-color',null);
  svg.selectAll('.graph-node').each(function(d){
    const info=hlNodes[d.id];
    if(info&&info.types.size){
      const el=d3.select(this);
      for(const tp of info.types)el.classed(`hl-${tp}`,true);
      if(info.color)el.attr('data-hl-color',info.color).style('--hl-color',info.color);
    }
  });
  svg.selectAll('.graph-link').each(function(d){
    const k=`${d.source.id||d.source}→${d.target.id||d.target}`;
    const info=hlEdges[k];
    if(info&&info.types.size){
      const el=d3.select(this);
      for(const tp of info.types)el.classed(`hl-${tp}`,true);
      if(info.color)el.attr('data-hl-color',info.color).style('--hl-color',info.color);
    }
  });
}

function clearInlineHighlights(gid) {
  const g = _findGraphInfo(gid);
  if (!g) return;
  g.activeHighlights = {};
  applyInlineHighlights(gid);
  render();
}

bootstrap();
</script>
</body>
</html>
