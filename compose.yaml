name: igraph

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-igraph}
      POSTGRES_USER: ${POSTGRES_USER:-igraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-igraph}
    volumes:
      - igraph-postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - backplane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-igraph} -d ${POSTGRES_DB:-igraph}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  graph-engine-api:
    image: ${IGRAPH_GRAPH_ENGINE_IMAGE:-igraph-graph-engine:local}
    build:
      context: .
      dockerfile: deploy/docker/graph-data.Dockerfile
    pull_policy: never
    env_file:
      - .env
    environment:
      GRAPH_DATA_HOST: 0.0.0.0
      GRAPH_DATA_PORT: 21111
      AGENT_RUNTIME_URL: http://agent-runtime:21112
      BACKEND_CONTROL_URL: http://backend:21109
      IGRAPH_CONTROL_SERVICE_KEY: ${IGRAPH_CONTROL_SERVICE_KEY:?Set a shared random IGRAPH_CONTROL_SERVICE_KEY in .env}
      IGRAPH_DATA_ROOT: /data
      GRAPH_DATA_UPLOAD_DIR: /data/graph_engine/uploads
      GRAPH_DATASET_DIR: /data/graph_engine/datasets
      GRAPH_ML_ARTIFACT_ROOT: /data/graph_engine/artifacts
    volumes:
      - igraph-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "21111"
    networks:
      - backplane
    shm_size: ${GRAPH_DATA_SHM_SIZE:-1gb}
    restart: unless-stopped

  graph-engine-mcp:
    image: ${IGRAPH_GRAPH_ENGINE_MCP_IMAGE:-igraph-graph-engine-mcp:local}
    build:
      context: .
      dockerfile: deploy/docker/mcp.Dockerfile
    pull_policy: never
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 21110
      GRAPH_DATA_SERVER_URL: http://graph-engine-api:21111
      IGRAPH_CONTROL_SERVICE_KEY: ${IGRAPH_CONTROL_SERVICE_KEY:?Set a shared random IGRAPH_CONTROL_SERVICE_KEY in .env}
      IGRAPH_DATA_ROOT: /data
    volumes:
      - igraph-data:/data
    expose:
      - "21110"
    depends_on:
      graph-engine-api:
        condition: service_healthy
    networks:
      - backplane
    restart: unless-stopped

  agent-runtime:
    image: ${IGRAPH_AGENT_RUNTIME_IMAGE:-igraph-agent-runtime:local}
    build:
      context: .
      dockerfile: deploy/docker/agent-runtime.Dockerfile
    pull_policy: never
    env_file:
      - .env
    environment:
      AGENT_RUNTIME_HOST: 0.0.0.0
      AGENT_RUNTIME_PORT: 21112
      AGENT_RUNTIME_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-igraph}:${POSTGRES_PASSWORD:-igraph}@postgres:5432/${POSTGRES_DB:-igraph}
      GRAPH_ENGINE_MCP_URL: http://graph-engine-mcp:21110/mcp
      GRAPH_ENGINE_API_URL: http://graph-engine-api:21111
      BACKEND_CONTROL_URL: http://backend:21109
      IGRAPH_CONTROL_SERVICE_KEY: ${IGRAPH_CONTROL_SERVICE_KEY:?Set a shared random IGRAPH_CONTROL_SERVICE_KEY in .env}
      AGENT_RUNTIME_SKILLS_ROOT: /data/agent_runtime/skills
      IGRAPH_DATA_ROOT: /data
      AGNO_TELEMETRY: ${AGNO_TELEMETRY:-false}
    volumes:
      - igraph-data:/data
    expose:
      - "21112"
    depends_on:
      postgres:
        condition: service_healthy
      graph-engine-mcp:
        condition: service_healthy
    networks:
      - backplane
    # bubblewrap needs to create namespaces; Docker's default seccomp profile
    # refuses that, which forces the workspace into unisolated fallback mode.
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped

  backend:
    image: ${IGRAPH_BACKEND_IMAGE:-igraph-backend:local}
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    pull_policy: never
    env_file:
      - .env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 21109
      AGENT_RUNTIME_URL: http://agent-runtime:21112
      GRAPH_ENGINE_URL: http://graph-engine-api:21111
      IGRAPH_CONTROL_SERVICE_KEY: ${IGRAPH_CONTROL_SERVICE_KEY:?Set a shared random IGRAPH_CONTROL_SERVICE_KEY in .env}
      BACKEND_USERS_FILE: /data/backend/users.json
      BACKEND_PROJECTS_FILE: /data/backend/projects.json
      IGRAPH_DATA_ROOT: /data
    volumes:
      - igraph-data:/data
    expose:
      - "21109"
    depends_on:
      agent-runtime:
        condition: service_healthy
      graph-engine-api:
        condition: service_healthy
    networks:
      - backplane
    restart: unless-stopped

  frontend:
    image: ${IGRAPH_FRONTEND_IMAGE:-igraph-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    pull_policy: never
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 21109
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-21108}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backplane
    restart: unless-stopped

networks:
  backplane:
    name: ${IGRAPH_BACKPLANE_NETWORK:-igraph-backplane}

volumes:
  igraph-data:
    name: ${IGRAPH_DATA_VOLUME:-igraph-data}
  igraph-postgres:
    name: ${IGRAPH_POSTGRES_VOLUME:-igraph-postgres}
