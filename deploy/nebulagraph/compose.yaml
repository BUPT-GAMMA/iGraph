name: igraph-nebulagraph

services:
  metad0:
    image: ${NEBULA_METAD_IMAGE:-docker.io/vesoft/nebula-metad:v3.8.0}
    environment:
      USER: root
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --meta_server_addrs=metad0:9559
      - --local_ip=metad0
      - --ws_ip=metad0
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://metad0:19559/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ./data/meta0:/data/meta
      - ./logs/meta0:/logs
    networks:
      - nebula-net
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE

  storaged0:
    image: ${NEBULA_STORAGED_IMAGE:-docker.io/vesoft/nebula-storaged:v3.8.0}
    environment:
      USER: root
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --meta_server_addrs=metad0:9559
      - --local_ip=storaged0
      - --ws_ip=storaged0
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    depends_on:
      metad0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://storaged0:19779/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ./data/storage0:/data/storage
      - ./logs/storage0:/logs
    networks:
      - nebula-net
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE

  graphd:
    image: ${NEBULA_GRAPHD_IMAGE:-docker.io/vesoft/nebula-graphd:v3.8.0}
    environment:
      USER: root
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --meta_server_addrs=metad0:9559
      - --local_ip=graphd
      - --ws_ip=graphd
      - --port=9669
      - --ws_http_port=19669
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    depends_on:
      metad0:
        condition: service_healthy
      storaged0:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://graphd:19669/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:${NEBULA_GRAPH_PORT:-9669}:9669"
      - "127.0.0.1:${NEBULA_GRAPH_HTTP_PORT:-19669}:19669"
    volumes:
      - ./logs/graph:/logs
    networks:
      - nebula-net
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE

  init-storage:
    image: ${NEBULA_CONSOLE_IMAGE:-docker.io/vesoft/nebula-console:v3.6.0}
    entrypoint: ""
    command:
      - sh
      - -c
      - |
        for i in `seq 1 60`; do
          if nebula-console -addr graphd -port 9669 -u root -p nebula \
            -e 'ADD HOSTS "storaged0":9779'; then
            exit 0
          fi
          if nebula-console -addr graphd -port 9669 -u root -p nebula \
            -e 'SHOW HOSTS STORAGE' | grep -q storaged0; then
            exit 0
          fi
          sleep 2
        done
        exit 1
    depends_on:
      graphd:
        condition: service_healthy
    networks:
      - nebula-net
    restart: "no"

networks:
  nebula-net:
    driver: bridge
