# Disposable authenticated protocol acceptance; secret file stays outside Git.
services:
  falkordb:
    image: falkordb/falkordb-server:v4.20.7@sha256:538fe1867a0a5dec55462eff5c1ea5edfc36246a9aa571cf1705b8b3f3d0f32c
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        exec redis-server --bind 0.0.0.0 --protected-mode yes
        --requirepass "$$(cat /run/secrets/falkordb_password)"
        --save "" --appendonly no
        --loadmodule /var/lib/falkordb/bin/falkordb.so
        THREAD_COUNT 2 TIMEOUT_MAX 3000 TIMEOUT_DEFAULT 1000
        RESULTSET_SIZE 128 QUERY_MEM_CAPACITY 8388608
    secrets: [falkordb_password]
    ports:
      - '127.0.0.1:${IGRAPH_TEST_FALKORDB_PORT:-21188}:6379'
    networks:
      default: {}
      app:
        aliases: [igraph-falkordb-qa]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$(cat /run/secrets/falkordb_password)" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
secrets:
  falkordb_password:
    file: ${IGRAPH_TEST_FALKORDB_PASSWORD_FILE:?Set private password file path}
networks:
  app:
    external: true
    name: ${IGRAPH_BACKPLANE_NETWORK:-igraph-backplane}
