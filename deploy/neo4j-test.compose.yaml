# Dedicated local acceptance only. Password comes from a private file, never YAML.
services:
  neo4j:
    image: neo4j:5.26-community@sha256:5eb12ad77fa46ab73e23df9ea1f43f5c0f2a79523435577648e046be042b9b93
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    secrets:
      - neo4j_auth
    ports:
      - '127.0.0.1:21187:7687'
      - '127.0.0.1:21174:7474'
    volumes:
      - cora-data:/data
    networks:
      default: {}
      app:
        aliases: [igraph-neo4j-qa]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
secrets:
  neo4j_auth:
    file: ${IGRAPH_TEST_NEO4J_AUTH_FILE:?Set private auth file path}
networks:
  app:
    external: true
    name: ${IGRAPH_BACKPLANE_NETWORK:-igraph-backplane}
volumes:
  cora-data: {}
